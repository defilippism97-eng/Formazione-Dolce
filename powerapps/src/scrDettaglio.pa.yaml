# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrDettaglio
#  5 – Dettaglio e approvazione (lavoratore in lettura, coordinatore, HR)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: SDF_API10 (dettaglio, permessi, storico), SDF_API06 (coordinatore), SDF_API07 (HR), SDF_API03 (annulla).
# =============================================================================
Screens:
  scrDettaglio:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        UpdateContext({locDialogo: "", locAzione: "", locErrore: ""});
        Set(varCaricamento, true);
        Set(varMessaggioCaricamento, "Caricamento della richiesta…");
        Set(varJsonDettaglio, jsonVuotoDettaglio);
        With(
            {r: IfError(SDF_API10_DettaglioRichiesta.Run(varIdDettaglio), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
            If(
                r.esito = "OK",
                Set(varJsonDettaglio, r.dati),
                UpdateContext({locErrore: r.messaggio});
                Notify(r.messaggio, NotificationType.Error)
            )
        );
        Reset(det_txtOreRetCoord);
        Reset(det_txtOreGetCoord);
        Reset(det_txtNotaCoord);
        Reset(det_txtOreRetHR);
        Reset(det_txtOreGetHR);
        Reset(det_txtNotaHR);
        Set(varCaricamento, false)
    Children:
      - det_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - det_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - det_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - det_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - det_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - det_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - det_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - det_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - det_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Navigate(scrRichiesta, ScreenTransition.None),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - det_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - det_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - det_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = ""
                  - det_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - det_conTitolo:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =44
                              FillPortions: =0
                            Children:
                              - det_icoIndietro:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.BackArrow
                                    OnSelect: |-
                                      =If(
                                          varDaLinkDiretto,
                                          Set(varDaLinkDiretto, false);
                                          Navigate(scrHome, ScreenTransition.None),
                                          Back()
                                      )
                                    Color: =colPrimario
                                    Tooltip: |-
                                      ="Indietro"
                                    Width: =32
                                    Height: =32
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    FillPortions: =0
                              - det_lblTitolo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Richiesta " & recDettaglio.idRichiesta
                                    Size: =18
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    FillPortions: =1
                              - det_lblStato:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =recDettaglio.stato
                                    Size: =10
                                    Color: =Color.White
                                    FontWeight: =FontWeight.Semibold
                                    Fill: =recDettaglio.colore
                                    Align: =Align.Center
                                    Width: =If(isMobile, 150, 240)
                                    Height: =28
                                    Visible: =!IsBlank(recDettaglio.stato)
                        - det_lblErrore:
                            Control: Label@2.5.1
                            Properties:
                              Text: =locErrore
                              Size: =12
                              Color: =Color.White
                              FontWeight: =FontWeight.Semibold
                              Fill: =colErrore
                              PaddingLeft: =12
                              Height: =40
                              Wrap: =true
                              FillPortions: =0
                              Visible: =!IsBlank(locErrore)
                        - det_lblMeseChiuso:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Il mese di competenza è chiuso: la richiesta non è più modificabile."
                              Size: =12
                              Color: =Color.White
                              FontWeight: =FontWeight.Semibold
                              Fill: =colTestoSecondario
                              PaddingLeft: =12
                              Height: =36
                              FillPortions: =0
                              Visible: =recPermessi.meseChiuso
                        - det_conPanCoord:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colSuccesso
                              BorderThickness: =2
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + det_lblSezCoord.Height + 8 + det_lblInfoCoord.Height + 8 + det_rigaOreCoord.Height + 8 + det_conCampoNotaCoord.Height + 8 + If(det_lblErrCoord.Visible, det_lblErrCoord.Height + 8, 0) + det_conPulsantiCoord.Height + 8
                              Visible: =recPermessi.esitoCoordinatore
                            Children:
                              - det_lblSezCoord:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Esito del coordinatore"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
                                    VerticalAlign: =VerticalAlign.Bottom
                              - det_lblInfoCoord:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Le ore riconosciute partono dalle ore richieste e si possono ridurre. Per respingere o chiedere un’integrazione la nota è obbligatoria."
                                    Size: =11
                                    Color: =colTestoSecondario
                                    AutoHeight: =true
                                    Wrap: =true
                                    FillPortions: =0
                                    Height: =20
                              - det_rigaOreCoord:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + 76 + 76, 64)
                                  Children:
                                    - det_conCampoOreRetCoord:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - det_lblCampoOreRetCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Ore retribuite riconosciute"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - det_txtOreRetCoord:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: =recDettaglio.oreRetribuiteRichieste
                                                HintText: |-
                                                  ="0"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                Format: =TextFormat.Number
                                    - det_conCampoOreGetCoord:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - det_lblCampoOreGetCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Ore gettone riconosciute"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - det_txtOreGetCoord:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: =recDettaglio.oreGettoneRichieste
                                                HintText: |-
                                                  ="0"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                Format: =TextFormat.Number
                                    - det_conCampoOreFreqCoord:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - det_lblCampoOreFreqCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Ore frequentate dichiarate"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - det_lblOreFreqCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  =Text(recDettaglio.oreFrequentate, "[$-en-US]0.##") & " h"
                                                Size: =13
                                                Color: =colTesto
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                Height: =36
                              - det_conCampoNotaCoord:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =100
                                  Children:
                                    - det_lblCampoNotaCoord:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Nota per il lavoratore (obbligatoria per respingere o chiedere integrazione)"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - det_txtNotaCoord:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          Default: |-
                                            =""
                                          HintText: |-
                                            ="Motivazione o cosa correggere"
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =72
                                          FillPortions: =0
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          Mode: =TextMode.MultiLine
                              - det_lblErrCoord:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      =With(
                                          {rt: Coalesce(Value(det_txtOreRetCoord.Text), 0), gt: Coalesce(Value(det_txtOreGetCoord.Text), 0)},
                                          If(
                                              rt < 0 || gt < 0, "R4 · Le ore riconosciute non possono essere negative.",
                                              rt + gt > recDettaglio.oreFrequentate, "R4 · Ore retribuite + gettone riconosciute (" & Text(rt + gt, "[$-en-US]0.##") & ") superano le ore frequentate (" & Text(recDettaglio.oreFrequentate, "[$-en-US]0.##") & ").",
                                              ""
                                          )
                                      )
                                    Size: =11
                                    Color: =colErrore
                                    Height: =24
                                    Wrap: =true
                                    FillPortions: =0
                                    Visible: =!IsBlank(Self.Text)
                              - det_conPulsantiCoord:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutWrap: =true
                                    Height: =If(isMobile, 3 * 48, 48)
                                    FillPortions: =0
                                  Children:
                                    - det_icoApprova:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Check
                                          OnSelect: |-
                                            =If(IsBlank(det_lblErrCoord.Text), UpdateContext({locAzione: "approva", locDialogo: "coord"}))
                                          Color: =colSuccesso
                                          Tooltip: |-
                                            ="Approva"
                                          Width: =32
                                          Height: =32
                                          PaddingTop: =4
                                          PaddingBottom: =4
                                          PaddingLeft: =4
                                          PaddingRight: =4
                                          FillPortions: =0
                                    - det_btnApprova:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: |-
                                            ="Approva"
                                          OnSelect: |-
                                            =UpdateContext({locAzione: "approva", locDialogo: "coord"})
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Width: =140
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =colSuccesso
                                          Color: =Color.White
                                          HoverFill: =ColorFade(colSuccesso, -15%)
                                          PressedFill: =ColorFade(colSuccesso, -25%)
                                          BorderThickness: =0
                                          DisplayMode: =If(IsBlank(det_lblErrCoord.Text), DisplayMode.Edit, DisplayMode.Disabled)
                                    - det_icoRespingi:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Cancel
                                          OnSelect: |-
                                            =If(!IsBlank(Trim(det_txtNotaCoord.Text)), UpdateContext({locAzione: "respingi", locDialogo: "coord"}), Notify("Per respingere scrivi la motivazione.", NotificationType.Warning))
                                          Color: =colErrore
                                          Tooltip: |-
                                            ="Respingi"
                                          Width: =32
                                          Height: =32
                                          PaddingTop: =4
                                          PaddingBottom: =4
                                          PaddingLeft: =4
                                          PaddingRight: =4
                                          FillPortions: =0
                                    - det_btnRespingi:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: |-
                                            ="Respingi"
                                          OnSelect: |-
                                            =UpdateContext({locAzione: "respingi", locDialogo: "coord"})
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Width: =140
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =colErrore
                                          Color: =Color.White
                                          HoverFill: =ColorFade(colErrore, -15%)
                                          PressedFill: =ColorFade(colErrore, -25%)
                                          BorderThickness: =0
                                          DisplayMode: =If(!IsBlank(Trim(det_txtNotaCoord.Text)), DisplayMode.Edit, DisplayMode.Disabled)
                                          Tooltip: |-
                                            ="Scrivi prima la motivazione"
                                    - det_icoIntegrazioneCoord:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Message
                                          OnSelect: |-
                                            =If(!IsBlank(Trim(det_txtNotaCoord.Text)), UpdateContext({locAzione: "integrazione", locDialogo: "coord"}), Notify("Per chiedere un’integrazione scrivi cosa correggere.", NotificationType.Warning))
                                          Color: =colAvviso
                                          Tooltip: |-
                                            ="Richiedi integrazione"
                                          Width: =32
                                          Height: =32
                                          PaddingTop: =4
                                          PaddingBottom: =4
                                          PaddingLeft: =4
                                          PaddingRight: =4
                                          FillPortions: =0
                                    - det_btnIntegrazioneCoord:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: |-
                                            ="Richiedi integrazione"
                                          OnSelect: |-
                                            =UpdateContext({locAzione: "integrazione", locDialogo: "coord"})
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Width: =200
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =colAvviso
                                          Color: =Color.White
                                          HoverFill: =ColorFade(colAvviso, -15%)
                                          PressedFill: =ColorFade(colAvviso, -25%)
                                          BorderThickness: =0
                                          DisplayMode: =If(!IsBlank(Trim(det_txtNotaCoord.Text)), DisplayMode.Edit, DisplayMode.Disabled)
                                          Tooltip: |-
                                            ="Scrivi prima cosa deve essere corretto"
                        - det_conPanHR:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
