                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.Bold
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(520, Parent.Width - 32)
                  Height: =If(det_txtDialogoNota.Visible, 380, 290)
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - det_lblDialogoTitolo:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Switch(
                              locAzione,
                              "approva", "Approva richiesta",
                              "valida", "Valida richiesta",
                              "respingi", "Respingi richiesta",
                              "integrazione", "Richiedi integrazione",
                              "Annulla richiesta"
                          )
                        Size: =16
                        Color: =colPrimario
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        FillPortions: =0
                  - det_lblDialogoTesto:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Switch(
                              locDialogo,
                              "coord",
                              Switch(
                                  locAzione,
                                  "approva", "Approvare la richiesta riconoscendo " & det_txtOreRetCoord.Text & " ore retribuite e " & det_txtOreGetCoord.Text & " ore gettone? Passerà all’Ufficio HR per la validazione.",
                                  "respingi", "Respingere la richiesta? Il lavoratore riceverà la motivazione indicata.",
                                  "Chiedere un’integrazione al lavoratore? Potrà correggere e reinviare la richiesta."
                              ),
                              "hr",
                              Switch(
                                  locAzione,
                                  "valida", "Validare la richiesta con " & det_txtOreRetHR.Text & " ore retribuite e " & det_txtOreGetHR.Text & " ore gettone? Dopo la validazione non sarà più modificabile.",
                                  "respingi", "Respingere la richiesta? Lavoratore e coordinatore riceveranno la motivazione.",
                                  "Chiedere un’integrazione? La richiesta tornerà al lavoratore e poi di nuovo al coordinatore."
                              ),
                              "La richiesta " & recDettaglio.idRichiesta & " passerà allo stato «Annullata»."
                          )
                        Size: =12
                        Color: =colTesto
                        Wrap: =true
                        FillPortions: =1
                        VerticalAlign: =VerticalAlign.Top
                        LayoutMinHeight: =60
                  - det_txtDialogoNota:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: |-
                          =""
                        HintText: |-
                          ="Motivazione"
                        Size: =12
                        BorderColor: =colBordo
                        Height: =80
                        FillPortions: =0
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        Mode: =TextMode.MultiLine
                        Visible: =false
                  - det_conDialogoPulsanti:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =44
                        FillPortions: =0
                      Children:
                        - det_btnDialogoAnnulla:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Annulla"
                              OnSelect: |-
                                =UpdateContext({locDialogo: ""})
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =140
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =Color.White
                              Color: =colPrimario
                              HoverFill: =colPrimarioChiaro
                              PressedFill: =colPrimarioChiaro
                              HoverColor: =colPrimario
                              BorderColor: =colPrimario
                              BorderThickness: =1
                        - det_btnDialogoConferma:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Conferma"
                              OnSelect: |-
                                =Switch(
                                    locDialogo,
                                    "coord",
                                        Set(varCaricamento, true);
                                        Set(varMessaggioCaricamento, "Registrazione dell’esito…");
                                        With(
                                            {r: IfError(
                                                SDF_API06_EsitoCoordinatore.Run(
                                                    varIdDettaglio,
                                                    locAzione,
                                                    Coalesce(Value(det_txtOreRetCoord.Text), 0),
                                                    Coalesce(Value(det_txtOreGetCoord.Text), 0),
                                                    Trim(det_txtNotaCoord.Text)
                                                ),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                Notify(
                                                    Switch(
                                                        locAzione,
                                                        "approva", "Richiesta approvata: è stata inoltrata all’Ufficio HR per la validazione.",
                                                        "respingi", "Richiesta respinta: il lavoratore riceverà la motivazione.",
                                                        "Integrazione richiesta: il lavoratore riceverà la tua nota e potrà correggere la richiesta."
                                                    ),
                                                    NotificationType.Success
                                                );
                                                UpdateContext({locDialogo: ""});
                                                // aggiorna l'elenco del team (SDF_API05) e torna indietro
                                                With(
                                                    {rt: IfError(SDF_API05_RichiesteTeam.Run(varAnnoTeam, varMeseTeam), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                                    If(
                                                        rt.esito = "OK",
                                                        Set(varJsonTeam, rt.dati);
                                                        Set(varTeamCaricato, true),
                                                        Notify("Non è stato possibile caricare le richieste del team. " & rt.messaggio, NotificationType.Error)
                                                    )
                                                );
                                                Set(varCaricamento, false);
                                                If(varDaLinkDiretto, Set(varDaLinkDiretto, false); Navigate(scrTeam, ScreenTransition.None), Back()),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        );
                                        Set(varCaricamento, false),
                                    "hr",
                                        Set(varCaricamento, true);
                                        Set(varMessaggioCaricamento, "Registrazione della validazione…");
                                        With(
                                            {r: IfError(
                                                SDF_API07_EsitoHR.Run(
                                                    JSON(
                                                        {
                                                            azione: locAzione,
                                                            nota: Trim(det_txtNotaHR.Text),
                                                            richieste: Table(
                                                                {
                                                                    id: varIdDettaglio,
                                                                    oreRetribuite: Coalesce(Value(det_txtOreRetHR.Text), 0),
                                                                    oreGettone: Coalesce(Value(det_txtOreGetHR.Text), 0)
                                                                }
                                                            )
                                                        },
                                                        JSONFormat.IgnoreBinaryData
                                                    )
                                                ),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                With(
                                                    {scartate: IfError(Concat(Table(ParseJSON(r.dati).scartate) As s, Text(s.Value.motivo), " · "), "")},
                                                    If(
                                                        IsBlank(scartate),
                                                        Notify(
                                                            Switch(locAzione, "valida", "Richiesta validata.", "respingi", "Richiesta respinta.", "Integrazione richiesta.") &
                                                            " Lavoratore e coordinatore riceveranno una notifica.",
                                                            NotificationType.Success
                                                        );
                                                        UpdateContext({locDialogo: ""});
                                                        Refresh('Richieste formazione');
                                                        Set(varCaricamento, false);
                                                        If(varDaLinkDiretto, Set(varDaLinkDiretto, false); Navigate(scrValidazioneHR, ScreenTransition.None), Back()),
                                                        Notify("Operazione non eseguita: " & scartate, NotificationType.Error)
                                                    )
                                                ),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        );
                                        Set(varCaricamento, false),
                                    "annulla",
                                        Set(varCaricamento, true);
                                        Set(varMessaggioCaricamento, "Annullamento in corso…");
                                        With(
                                            {r: IfError(
                                                SDF_API03_SalvaRichiesta.Run(JSON({id: varIdDettaglio}, JSONFormat.IgnoreBinaryData), "annulla", "", "", "", ""),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                Notify("Richiesta annullata.", NotificationType.Success);
                                                With(
                                                    {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                                    If(
                                                        rm.esito = "OK",
                                                        Set(varJsonMieRichieste, rm.dati);
                                                        Set(varMieCaricate, true),
                                                        Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                                                    )
                                                );
                                                UpdateContext({locDialogo: ""});
                                                Set(varCaricamento, false);
                                                Navigate(scrMieRichieste, ScreenTransition.None),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        );
                                        Set(varCaricamento, false)
                                )
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =180
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =Switch(locAzione, "approva", colSuccesso, "valida", colSuccesso, "integrazione", colAvviso, colErrore)
                              Color: =Color.White
                              HoverFill: =colPrimarioScuro
                              PressedFill: =colPrimarioScuro
                              BorderThickness: =0
                              DisplayMode: =If(true, DisplayMode.Edit, DisplayMode.Disabled)
      - det_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - det_rctCaricamento:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 0.65)
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - det_lblCaricamento:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(varMessaggioCaricamento, "Caricamento in corso…") & Char(10) & "Attendere qualche secondo."
                  Size: =14
                  Color: =colPrimario
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(360, Parent.Width - 32)
                  Height: =96
                  Wrap: =true
                  BorderColor: =colBordo
                  BorderThickness: =1
