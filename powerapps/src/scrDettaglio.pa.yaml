                              - det_htmDati:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    HtmlText: |-
                                      ="<div style='font-family:Segoe UI,sans-serif;color:#201F1E'>" &
                                      "<div style='font-size:15px;font-weight:600;color:#005E7D;margin:14px 0 6px 0'>Lavoratore</div>" &
                                      "<div style='display:flex;flex-wrap:wrap;gap:10px 18px'>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Lavoratore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.nominativo, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>E-mail di contatto</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.emailPersonale, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Area</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.area, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Servizio</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.servizio, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Centro di costo</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.centroDiCosto, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Coordinatore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.coordinatoreNome, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "</div>" &
                                      "<div style='font-size:15px;font-weight:600;color:#005E7D;margin:14px 0 6px 0'>Corso</div>" &
                                      "<div style='display:flex;flex-wrap:wrap;gap:10px 18px'>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Titolo del corso</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.titolo, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Codice univoco corso</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.codiceCorso, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Ente erogatore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.enteErogatore, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Modalità di svolgimento</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.modalita, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Durata complessiva corso</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.durataCorso, "[$-en-US]0.##") & " h", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Più giornate formative</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(If(recDettaglio.piuGiornate, "Sì", "No"), "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "</div>" &
                                      "<div style='font-size:15px;font-weight:600;color:#005E7D;margin:14px 0 6px 0'>Sessione, presenza e ore</div>" &
                                      "<div style='display:flex;flex-wrap:wrap;gap:10px 18px'>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Data sessione</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.dataSessione, "dd/mm/yyyy"), "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Sessione (inizio – fine)</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.oraInizioSessione & " – " & recDettaglio.oraFineSessione & " (" & Text(recDettaglio.durataSessione, "[$-en-US]0.##") & " h)", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Presenza (ingresso – uscita)</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.oraIngresso & " – " & recDettaglio.oraUscita & " (" & Text(recDettaglio.oreFrequentate, "[$-en-US]0.##") & " h frequentate)", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Ore richieste (retribuite · gettone)</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.oreRetribuiteRichieste, "[$-en-US]0.##") & " retr. · " & Text(recDettaglio.oreGettoneRichieste, "[$-en-US]0.##") & " gett.", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Riconosciute dal coordinatore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.oreRetribuiteCoord, "[$-en-US]0.##") & " retr. · " & Text(recDettaglio.oreGettoneCoord, "[$-en-US]0.##") & " gett.", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Approvate da HR</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.oreRetribuiteHR, "[$-en-US]0.##") & " retr. · " & Text(recDettaglio.oreGettoneHR, "[$-en-US]0.##") & " gett.", "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "</div>" &
                                      "<div style='font-size:15px;font-weight:600;color:#005E7D;margin:14px 0 6px 0'>Note e date</div>" &
                                      "<div style='display:flex;flex-wrap:wrap;gap:10px 18px'>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Note del lavoratore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.noteLavoratore, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Note del coordinatore</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.noteCoordinatore, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Note HR</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.noteHR, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Competenza</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(Text(recDettaglio.meseCompetenza, "00") & "/" & recDettaglio.annoCompetenza, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Date</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce("Creata il " & Text(recDettaglio.creato, "dd/mm/yyyy hh:mm") &
                                      If(!IsBlank(recDettaglio.dataInvio), " · inviata il " & Text(recDettaglio.dataInvio, "dd/mm/yyyy hh:mm"), "") &
                                      If(!IsBlank(recDettaglio.dataApprovazioneCoord), " · approvata dal coordinatore il " & Text(recDettaglio.dataApprovazioneCoord, "dd/mm/yyyy hh:mm"), "") &
                                      If(!IsBlank(recDettaglio.dataValidazioneHR), " · validata da HR il " & Text(recDettaglio.dataValidazioneHR, "dd/mm/yyyy hh:mm"), ""), "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "<div style='flex:1 1 210px;min-width:170px'><div style='font-size:11px;color:#605E5C'>Ultima azione di</div><div style='font-size:13px;font-weight:600'>" & Substitute(Substitute(Substitute(Coalesce(recDettaglio.ultimaModificaDa, "—"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</div></div>" &
                                      "</div>" &
                                      "</div>"
                                    FillPortions: =0
                                    Height: =400
