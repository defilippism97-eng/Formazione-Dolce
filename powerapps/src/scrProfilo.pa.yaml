                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Width: =240
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =Color.White
                                          Color: =colPrimario
                                          HoverFill: =colPrimarioChiaro
                                          PressedFill: =colPrimarioChiaro
                                          HoverColor: =colPrimario
                                          BorderColor: =colPrimario
                                          BorderThickness: =1
                                          DisplayMode: =If(IsBlank(Trim(pro_txtSegnalazione.Text)), DisplayMode.Disabled, DisplayMode.Edit)
      - pro_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - pro_rctCaricamento:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 0.65)
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - pro_lblCaricamento:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(varMessaggioCaricamento, "Caricamento in corso…") & Char(10) & "Attendere qualche secondo."
                  Size: =14
                  Color: =colPrimario
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(360, Parent.Width - 32)
                  Height: =96
                  Wrap: =true
                  BorderColor: =colBordo
                  BorderThickness: =1
