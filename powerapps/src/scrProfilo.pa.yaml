                        - pro_conSegnalazione:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + pro_lblSezSegnalazione.Height + 8 + If(pro_lblSegnalazioneAperta.Visible, pro_lblSegnalazioneAperta.Height + 8, 0) + pro_txtSegnalazione.Height + 8 + pro_conSegnala.Height + 8
                            Children:
                              - pro_lblSezSegnalazione:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Segnala una variazione a HR"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
