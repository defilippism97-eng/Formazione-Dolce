                              "chiudi",
                              "Chiudere il mese " & locPeriodo & "? Le richieste validate diventeranno «Inclusa nel riepilogo mensile» e nel mese non saranno più possibili inserimenti o modifiche." &
                              If(CountRows(colChiAperte) > 0, " ATTENZIONE: ci sono " & CountRows(colChiAperte) & " richieste ancora aperte, che resteranno bloccate fino a un’eventuale riapertura da parte dell’Amministratore.", "") &
                              " Puoi aggiungere una nota (facoltativa).",
                              "riapri",
                              "Riaprire il mese " & locPeriodo & "? Le richieste torneranno modificabili secondo il loro stato. La motivazione è obbligatoria e viene registrata.",
                              "Generare il file paghe di " & locPeriodo & "? Le richieste incluse passeranno a «Inviata a Payroll» e il collegamento sarà inviato ai destinatari configurati." &
                              If(locChiusura.'File paghe generato', " Esiste già un file per il periodo: verrà creata una nuova versione.", "")
                          )
                        Size: =12
                        Color: =colTesto
                        Wrap: =true
                        FillPortions: =1
                        VerticalAlign: =VerticalAlign.Top
                        LayoutMinHeight: =60
                  - chi_txtDialogoNota:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: |-
                          =""
                        HintText: =If(locDialogo = "riapri", "Motivazione della riapertura (obbligatoria)", "Note HR (facoltative)")
                        Size: =12
                        BorderColor: =colBordo
                        Height: =80
                        FillPortions: =0
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        Mode: =TextMode.MultiLine
                        Visible: =locDialogo = "chiudi" || locDialogo = "riapri"
                  - chi_conDialogoPulsanti:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =44
                        FillPortions: =0
                      Children:
                        - chi_btnDialogoAnnulla:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Annulla"
                              OnSelect: |-
                                =UpdateContext({locDialogo: ""})
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =140
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =Color.White
                              Color: =colPrimario
                              HoverFill: =colPrimarioChiaro
                              PressedFill: =colPrimarioChiaro
                              HoverColor: =colPrimario
                              BorderColor: =colPrimario
                              BorderThickness: =1
                        - chi_btnDialogoConferma:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =Switch(locDialogo, "chiudi", "Chiudi il mese", "riapri", "Riapri", "Genera")
                              OnSelect: |-
                                =Set(varCaricamento, true);
                                Set(varMessaggioCaricamento, "Operazione in corso…");
                                Switch(
                                    locDialogo,
                                    "chiudi",
                                        With(
                                            {r: IfError(
                                                SDF_API08_ChiusuraMensile.Run(chi_ddAnno.Selected.Num, chi_ddMese.Selected.Num, "chiudi", Trim(chi_txtDialogoNota.Text)),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                Notify(Coalesce(r.messaggio, "Mese chiuso."), NotificationType.Success);
                                                UpdateContext({locDialogo: ""});
                                                Reset(chi_txtDialogoNota);
                                                Select(chi_btnVerifica),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        ),
                                    "riapri",
                                        With(
                                            {r: IfError(
                                                SDF_API08_ChiusuraMensile.Run(chi_ddAnno.Selected.Num, chi_ddMese.Selected.Num, "riapri", Trim(chi_txtDialogoNota.Text)),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                Notify(Coalesce(r.messaggio, "Mese riaperto."), NotificationType.Success);
                                                UpdateContext({locDialogo: ""});
                                                Reset(chi_txtDialogoNota);
                                                Select(chi_btnVerifica),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        ),
                                    "paghe",
                                        With(
                                            {r: IfError(
                                                SDF_API09_FilePaghe.Run(chi_ddAnno.Selected.Num, chi_ddMese.Selected.Num),
                                                {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                            )},
                                            If(
                                                r.esito = "OK",
                                                With(
                                                    {d: IfError(ParseJSON(r.dati), ParseJSON("{}"))},
                                                    UpdateContext({locUrlFile: Text(d.url), locDialogo: ""});
                                                    Notify(
                                                        "File paghe generato con " & Text(d.richieste) & " richieste: usa «Apri il file paghe»." &
                                                        If(Coalesce(Value(d.senzaCodiceFiscale), 0) > 0, " Attenzione: " & Text(d.senzaCodiceFiscale) & " righe senza codice fiscale.", ""),
                                                        If(Coalesce(Value(d.senzaCodiceFiscale), 0) > 0, NotificationType.Warning, NotificationType.Success)
                                                    )
                                                );
                                                Select(chi_btnVerifica),
                                                Notify(r.messaggio, NotificationType.Error)
                                            )
                                        )
                                );
                                Set(varCaricamento, false)
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =180
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =If(locDialogo = "riapri", colAvviso, colPrimario)
                              Color: =Color.White
                              HoverFill: =colPrimarioScuro
                              PressedFill: =colPrimarioScuro
                              BorderThickness: =0
                              DisplayMode: =If(locDialogo <> "riapri" || !IsBlank(Trim(chi_txtDialogoNota.Text)), DisplayMode.Edit, DisplayMode.Disabled)
      - chi_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - chi_rctCaricamento:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 0.65)
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - chi_lblCaricamento:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(varMessaggioCaricamento, "Caricamento in corso…") & Char(10) & "Attendere qualche secondo."
                  Size: =14
                  Color: =colPrimario
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(360, Parent.Width - 32)
                  Height: =96
                  Wrap: =true
                  BorderColor: =colBordo
                  BorderThickness: =1
