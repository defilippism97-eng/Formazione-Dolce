# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrChiusura
#  8 – Chiusura mensile e file paghe (HR; riapertura solo Amministratore)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: letture dirette (HR); SDF_API08_ChiusuraMensile e SDF_API09_FilePaghe; Patch su Lavoratori (segnalazioni, CF).
# =============================================================================
Screens:
  scrChiusura:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        UpdateContext({locDialogo: ""});
        Set(varCaricamento, true);
        Set(varMessaggioCaricamento, "Verifica del mese in corso…");
        UpdateContext({locPeriodo: Text(chi_ddAnno.Selected.Num) & "-" & Text(chi_ddMese.Selected.Num, "00"), locUrlFile: ""});
        Refresh('Chiusure mensili');
        UpdateContext({locChiusura: LookUp('Chiusure mensili', Periodo = locPeriodo)});
        // richieste ancora aperte nel mese (stati precedenti alla validazione HR) – filtro delegabile
        ClearCollect(
            colChiAperte,
            ShowColumns(
                Filter(
                    'Richieste formazione',
                    'Anno di competenza' = chi_ddAnno.Selected.Num,
                    'Mese di competenza' = chi_ddMese.Selected.Num,
                    'Stato richiesta'.Value = "Bozza" ||
                    'Stato richiesta'.Value = "Inviata al coordinatore" ||
                    'Stato richiesta'.Value = "In attesa del coordinatore" ||
                    'Stato richiesta'.Value = "Integrazione richiesta dal coordinatore" ||
                    'Stato richiesta'.Value = "Approvata dal coordinatore" ||
                    'Stato richiesta'.Value = "In attesa di validazione HR" ||
                    'Stato richiesta'.Value = "Integrazione richiesta da HR"
                ),
                ID, 'ID richiesta', Cognome, Nome, Coordinatore, 'Stato richiesta', 'Data sessione formativa'
            )
        );
        // richieste approvate o validate del mese: base per anomalie e controllo del codice fiscale
        ClearCollect(
            colChiDaVerificare,
            ShowColumns(
                Filter(
                    'Richieste formazione',
                    'Anno di competenza' = chi_ddAnno.Selected.Num,
                    'Mese di competenza' = chi_ddMese.Selected.Num,
                    'Stato richiesta'.Value = "Approvata dal coordinatore" ||
                    'Stato richiesta'.Value = "In attesa di validazione HR" ||
                    'Stato richiesta'.Value = "Validata da HR" ||
                    'Stato richiesta'.Value = "Inclusa nel riepilogo mensile" ||
                    'Stato richiesta'.Value = "Inviata a Payroll"
                ),
                ID, 'ID richiesta', Cognome, Nome, 'Login lavoratore', Coordinatore, 'Stato richiesta', 'Possibile duplicato',
                'Attestato presente', 'Anomalie rilevate', 'Titolo del corso a catalogo', 'Titolo corso libero', 'Data sessione formativa'
            )
        );
        // anomalie: possibili duplicati, attestato mancante, anomalie segnalate dai flussi (colonna multilinea: filtro locale)
        ClearCollect(
            colChiAnomalie,
            Filter(colChiDaVerificare, 'Possibile duplicato' || !'Attestato presente' || !IsBlank('Anomalie rilevate'))
        );
        // lavoratori con una segnalazione di variazione da gestire
        ClearCollect(colChiSegnalazioni, Filter(Lavoratori, 'Segnalazione da gestire' = true));
        // lavoratori delle richieste validate del mese senza codice fiscale
        ClearCollect(colChiLavSenzaCF, Filter(Lavoratori, 'Codice fiscale registrato' = false));
        ClearCollect(
            colChiSenzaCF,
            Filter(
                colChiLavSenzaCF,
                'Login Microsoft 365' in Filter(
                    colChiDaVerificare,
                    'Stato richiesta'.Value = "Validata da HR" || 'Stato richiesta'.Value = "Inclusa nel riepilogo mensile" || 'Stato richiesta'.Value = "Inviata a Payroll"
                ).'Login lavoratore'
            )
        );
        Set(varCaricamento, false)
    Children:
      - chi_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - chi_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - chi_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - chi_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - chi_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - chi_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - chi_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - chi_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - chi_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "chiusura", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Navigate(scrRichiesta, ScreenTransition.None),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - chi_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "chiusura", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - chi_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "chiusura", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "chiusura", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - chi_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = "chiusura"
                  - chi_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - chi_lblTitolo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Chiusura mensile e file paghe"
                              Size: =18
                              Color: =colPrimario
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              FillPortions: =0
                        - chi_lblInfo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="1) Scegli il mese e verifica richieste aperte e anomalie. 2) Chiudi il mese: le richieste validate vengono incluse nel riepilogo e il mese non è più modificabile. 3) Genera il file paghe (CSV con separatore ;). Solo l’Amministratore può riaprire un mese chiuso."
                              Size: =11
                              Color: =colTestoSecondario
                              AutoHeight: =true
                              Wrap: =true
                              FillPortions: =0
                              Height: =20
                        - chi_rigaPeriodo:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =12
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =If(isMobile, 76 + 76 + 76, 64)
                            Children:
                              - chi_conCampoAnno:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =64
                                  Children:
                                    - chi_lblCampoAnno:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Anno"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - chi_ddAnno:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Items: =tblAnni
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          ChevronBackground: =colPrimario
                                          ChevronFill: =Color.White
                                          Default: =Text(Year(DateAdd(Today(), -1, TimeUnit.Months)))
                                          OnChange: =Select(chi_btnVerifica)
                              - chi_conCampoMese:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =64
                                  Children:
                                    - chi_lblCampoMese:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Mese"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - chi_ddMese:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Items: =tblMesi
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          ChevronBackground: =colPrimario
                                          ChevronFill: =Color.White
                                          Default: =LookUp(tblMesi, Num = Month(DateAdd(Today(), -1, TimeUnit.Months))).Value
                                          OnChange: =Select(chi_btnVerifica)
                              - chi_conCampoVerifica:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =64
                                  Children:
                                    - chi_lblCampoVerifica:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            =" "
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - chi_btnVerifica:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: |-
                                            ="Verifica il mese"
                                          OnSelect: |-
                                            =Set(varCaricamento, true);
                                            Set(varMessaggioCaricamento, "Verifica del mese in corso…");
                                            UpdateContext({locPeriodo: Text(chi_ddAnno.Selected.Num) & "-" & Text(chi_ddMese.Selected.Num, "00"), locUrlFile: ""});
                                            Refresh('Chiusure mensili');
                                            UpdateContext({locChiusura: LookUp('Chiusure mensili', Periodo = locPeriodo)});
                                            // richieste ancora aperte nel mese (stati precedenti alla validazione HR) – filtro delegabile
                                            ClearCollect(
                                                colChiAperte,
                                                ShowColumns(
                                                    Filter(
                                                        'Richieste formazione',
                                                        'Anno di competenza' = chi_ddAnno.Selected.Num,
                                                        'Mese di competenza' = chi_ddMese.Selected.Num,
                                                        'Stato richiesta'.Value = "Bozza" ||
                                                        'Stato richiesta'.Value = "Inviata al coordinatore" ||
                                                        'Stato richiesta'.Value = "In attesa del coordinatore" ||
                                                        'Stato richiesta'.Value = "Integrazione richiesta dal coordinatore" ||
                                                        'Stato richiesta'.Value = "Approvata dal coordinatore" ||
                                                        'Stato richiesta'.Value = "In attesa di validazione HR" ||
                                                        'Stato richiesta'.Value = "Integrazione richiesta da HR"
                                                    ),
                                                    ID, 'ID richiesta', Cognome, Nome, Coordinatore, 'Stato richiesta', 'Data sessione formativa'
                                                )
                                            );
                                            // richieste approvate o validate del mese: base per anomalie e controllo del codice fiscale
                                            ClearCollect(
                                                colChiDaVerificare,
                                                ShowColumns(
                                                    Filter(
                                                        'Richieste formazione',
                                                        'Anno di competenza' = chi_ddAnno.Selected.Num,
                                                        'Mese di competenza' = chi_ddMese.Selected.Num,
                                                        'Stato richiesta'.Value = "Approvata dal coordinatore" ||
                                                        'Stato richiesta'.Value = "In attesa di validazione HR" ||
                                                        'Stato richiesta'.Value = "Validata da HR" ||
                                                        'Stato richiesta'.Value = "Inclusa nel riepilogo mensile" ||
                                                        'Stato richiesta'.Value = "Inviata a Payroll"
                                                    ),
                                                    ID, 'ID richiesta', Cognome, Nome, 'Login lavoratore', Coordinatore, 'Stato richiesta', 'Possibile duplicato',
                                                    'Attestato presente', 'Anomalie rilevate', 'Titolo del corso a catalogo', 'Titolo corso libero', 'Data sessione formativa'
                                                )
                                            );
                                            // anomalie: possibili duplicati, attestato mancante, anomalie segnalate dai flussi (colonna multilinea: filtro locale)
                                            ClearCollect(
                                                colChiAnomalie,
                                                Filter(colChiDaVerificare, 'Possibile duplicato' || !'Attestato presente' || !IsBlank('Anomalie rilevate'))
                                            );
                                            // lavoratori con una segnalazione di variazione da gestire
                                            ClearCollect(colChiSegnalazioni, Filter(Lavoratori, 'Segnalazione da gestire' = true));
                                            // lavoratori delle richieste validate del mese senza codice fiscale
                                            ClearCollect(colChiLavSenzaCF, Filter(Lavoratori, 'Codice fiscale registrato' = false));
                                            ClearCollect(
                                                colChiSenzaCF,
                                                Filter(
                                                    colChiLavSenzaCF,
                                                    'Login Microsoft 365' in Filter(
                                                        colChiDaVerificare,
                                                        'Stato richiesta'.Value = "Validata da HR" || 'Stato richiesta'.Value = "Inclusa nel riepilogo mensile" || 'Stato richiesta'.Value = "Inviata a Payroll"
                                                    ).'Login lavoratore'
                                                )
                                            );
                                            Set(varCaricamento, false)
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Width: =200
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =Color.White
                                          Color: =colPrimario
                                          HoverFill: =colPrimarioChiaro
                                          PressedFill: =colPrimarioChiaro
                                          HoverColor: =colPrimario
                                          BorderColor: =colPrimario
                                          BorderThickness: =1
                        - chi_lblStato:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Periodo " & locPeriodo & ": " & Coalesce(locChiusura.'Stato del periodo'.Value, "Aperto (nessuna chiusura registrata)") &
                                If(!IsBlank(locChiusura.'Data chiusura'), " · chiuso il " & Text(locChiusura.'Data chiusura', "dd/mm/yyyy hh:mm") & " da " & locChiusura.'Utente chiusura', "") &
                                If(!IsBlank(locChiusura.'Numero richieste incluse'), " · richieste incluse: " & locChiusura.'Numero richieste incluse' & " · ore riconosciute: " & Text(locChiusura.'Totale ore riconosciute', "[$-en-US]#,##0.##") & " · gettoni: " & Text(locChiusura.'Totale gettoni', "[$-en-US]#,##0.##"), "") &
                                If(locChiusura.'File paghe generato', " · file paghe generato (versione " & locChiusura.'Versione file paghe' & ")", "") &
                                If(locChiusura.'Stato del periodo'.Value = "Riaperto", " · riaperto il " & Text(locChiusura.'Data riapertura', "dd/mm/yyyy") & " da " & locChiusura.'Utente riapertura' & ": " & locChiusura.'Motivo riapertura', "")
                              Size: =13
                              Color: =Switch(locChiusura.'Stato del periodo'.Value, "Chiuso", colSuccesso, "Riaperto", colAvviso, colPrimario)
                              FontWeight: =FontWeight.Semibold
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingLeft: =12
                              PaddingTop: =8
                              PaddingBottom: =8
                              AutoHeight: =true
                              Wrap: =true
                              Height: =40
                              FillPortions: =0
                        - chi_conKpi:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =12
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutWrap: =true
                              FillPortions: =0
                              Height: =If(isMobile, 2 * 96, 84)
                            Children:
                              - chi_conKpiAperte:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =2
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    FillPortions: =1
                                    LayoutMinWidth: =140
                                    Height: =84
                                    BorderColor: =colBordo
                                    BorderThickness: =1
                                    PaddingLeft: =12
                                    PaddingTop: =8
                                  Children:
                                    - chi_lblKpiValAperte:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Text(CountRows(colChiAperte))
                                          Size: =20
                                          Color: =If(CountRows(colChiAperte) > 0, colAvviso, colSuccesso)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          FillPortions: =0
                                    - chi_lblKpiTitAperte:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Richieste ancora aperte"
                                          Size: =10
                                          Color: =colTestoSecondario
                                          Height: =32
                                          Wrap: =true
                                          FillPortions: =0
                              - chi_conKpiAnomalie:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =2
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    FillPortions: =1
                                    LayoutMinWidth: =140
                                    Height: =84
                                    BorderColor: =colBordo
                                    BorderThickness: =1
                                    PaddingLeft: =12
                                    PaddingTop: =8
                                  Children:
                                    - chi_lblKpiValAnomalie:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Text(CountRows(colChiAnomalie))
                                          Size: =20
                                          Color: =If(CountRows(colChiAnomalie) > 0, colAvviso, colSuccesso)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          FillPortions: =0
                                    - chi_lblKpiTitAnomalie:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Anomalie (duplicati, attestati mancanti, altre)"
                                          Size: =10
                                          Color: =colTestoSecondario
                                          Height: =32
                                          Wrap: =true
                                          FillPortions: =0
                              - chi_conKpiSegnalazioni:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =2
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    FillPortions: =1
