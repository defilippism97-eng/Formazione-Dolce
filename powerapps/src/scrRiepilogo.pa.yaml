# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrRiepilogo
#  7 – Riepilogo mensile (lavoratore: proprie; coordinatore: gruppo; HR: tutto)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: lavoratore SDF_API02; coordinatore SDF_API05; HR lettura diretta di 'Richieste formazione'.
# =============================================================================
Screens:
  scrRiepilogo:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        If(
            IsBlank(LookUp(tblPerimetriRiep, Chiave = varPerimetroRiep)),
            Set(varPerimetroRiep, If(isHR, "hr", isCoord, "team", "personale"))
        );
        Reset(rie_ddPerimetro);
        Set(varCaricamento, true);
        Set(varMessaggioCaricamento, "Caricamento del riepilogo…");
        Switch(
            varPerimetroRiep,
            "personale",
            // lavoratore: le proprie richieste (SDF_API02)
            If(
                !varMieCaricate,
                With(
                    {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                    If(
                        rm.esito = "OK",
                        Set(varJsonMieRichieste, rm.dati);
                        Set(varMieCaricate, true),
                        Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                    )
                )
            );
        ClearCollect(
            colRiepilogo,
            ForAll(
                Filter(colMieRichieste, annoCompetenza = rie_ddAnno.Selected.Num, rie_ddMese.Selected.Num = 0 || meseCompetenza = rie_ddMese.Selected.Num) As x,
                {id: x.id, idRichiesta: x.idRichiesta, lavoratoreLogin: x.lavoratoreLogin, nominativo: x.nominativo, area: x.area, servizio: x.servizio, centroDiCosto: x.centroDiCosto, coordinatoreLogin: x.coordinatoreLogin, coordinatoreNome: x.coordinatoreNome, codiceCorso: x.codiceCorso, titolo: x.titolo, dataSessione: x.dataSessione, oreFrequentate: x.oreFrequentate, oreRetribuiteRichieste: x.oreRetribuiteRichieste, oreGettoneRichieste: x.oreGettoneRichieste, oreRetribuiteCoord: x.oreRetribuiteCoord, oreGettoneCoord: x.oreGettoneCoord, oreRetribuiteHR: x.oreRetribuiteHR, oreGettoneHR: x.oreGettoneHR, stato: x.stato, possibileDuplicato: x.possibileDuplicato, attestatoPresente: x.attestatoPresente}
            )
        ),
        "team",
        // coordinatore: solo il proprio gruppo (SDF_API05)
        Set(varAnnoTeam, rie_ddAnno.Selected.Num);
        Set(varMeseTeam, rie_ddMese.Selected.Num);
            With(
                {rt: IfError(SDF_API05_RichiesteTeam.Run(varAnnoTeam, varMeseTeam), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                If(
                    rt.esito = "OK",
                    Set(varJsonTeam, rt.dati);
                    Set(varTeamCaricato, true),
                    Notify("Non è stato possibile caricare le richieste del team. " & rt.messaggio, NotificationType.Error)
                )
            );
            ClearCollect(colRiepilogo, ForAll(colRichiesteTeam As x, {id: x.id, idRichiesta: x.idRichiesta, lavoratoreLogin: x.lavoratoreLogin, nominativo: x.nominativo, area: x.area, servizio: x.servizio, centroDiCosto: x.centroDiCosto, coordinatoreLogin: x.coordinatoreLogin, coordinatoreNome: x.coordinatoreNome, codiceCorso: x.codiceCorso, titolo: x.titolo, dataSessione: x.dataSessione, oreFrequentate: x.oreFrequentate, oreRetribuiteRichieste: x.oreRetribuiteRichieste, oreGettoneRichieste: x.oreGettoneRichieste, oreRetribuiteCoord: x.oreRetribuiteCoord, oreGettoneCoord: x.oreGettoneCoord, oreRetribuiteHR: x.oreRetribuiteHR, oreGettoneHR: x.oreGettoneHR, stato: x.stato, possibileDuplicato: x.possibileDuplicato, attestatoPresente: x.attestatoPresente})),
            "hr",
            // HR / Amministratore: lettura diretta con filtri delegabili su anno e mese, poi stessa forma dei dati
            ClearCollect(
                colRiepSP,
                Filter(
                    'Richieste formazione',
                    'Anno di competenza' = rie_ddAnno.Selected.Num,
                    rie_ddMese.Selected.Num = 0 || 'Mese di competenza' = rie_ddMese.Selected.Num
                )
            );
            ClearCollect(
                colRiepilogo,
                ForAll(
                    colRiepSP As x,
                    {
                        id: x.ID,
                        idRichiesta: x.'ID richiesta',
                        lavoratoreLogin: Lower(x.'Login lavoratore'),
                        nominativo: Trim(x.Cognome & " " & x.Nome),
                        area: x.Area.Value,
                        servizio: x.Servizio,
                        centroDiCosto: x.'Centro di costo',
                        coordinatoreLogin: Lower(x.'Login coordinatore'),
                        coordinatoreNome: x.Coordinatore,
                        codiceCorso: x.'Codice univoco corso',
                        titolo: Coalesce(x.'Titolo del corso a catalogo', x.'Titolo corso libero'),
                        dataSessione: If(IsBlank(x.'Data sessione formativa'), Blank(), Date(Year(x.'Data sessione formativa'), Month(x.'Data sessione formativa'), Day(x.'Data sessione formativa'))),
                        oreFrequentate: Coalesce(x.'Ore frequentate dichiarate', 0),
                        oreRetribuiteRichieste: Coalesce(x.'Ore retribuite richieste', 0),
                        oreGettoneRichieste: Coalesce(x.'Ore gettone richieste', 0),
                        oreRetribuiteCoord: Coalesce(x.'Ore retribuite riconosciute coordinatore', 0),
                        oreGettoneCoord: Coalesce(x.'Ore gettone riconosciute coordinatore', 0),
                        oreRetribuiteHR: Coalesce(x.'Ore retribuite approvate HR', 0),
                        oreGettoneHR: Coalesce(x.'Ore gettone approvate HR', 0),
                        stato: x.'Stato richiesta'.Value,
                        possibileDuplicato: Coalesce(x.'Possibile duplicato', false),
                        attestatoPresente: Coalesce(x.'Attestato presente', false)
                    }
                )
            )
        );Reset(rie_ddArea);
        Reset(rie_ddServizio);
        Reset(rie_ddCdc);
        Reset(rie_ddCoord);
        Reset(rie_ddLavoratore);
        Reset(rie_ddStato);
        ClearCollect(colRiepFiltrato, colRiepilogo);
        Set(varCaricamento, false)
    Children:
      - rie_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - rie_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - rie_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - rie_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - rie_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - rie_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - rie_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - rie_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - rie_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "riepilogo", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Navigate(scrRichiesta, ScreenTransition.None),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - rie_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "riepilogo", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - rie_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "riepilogo", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "riepilogo", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - rie_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = "riepilogo"
                  - rie_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - rie_conTitolo:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =44
                              FillPortions: =0
                            Children:
                              - rie_lblTitolo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Riepilogo mensile"
                                    Size: =18
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    FillPortions: =1
                              - rie_btnCarica:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Aggiorna dati"
                                    OnSelect: |-
                                      =Set(varCaricamento, true);
                                      Set(varMessaggioCaricamento, "Caricamento del riepilogo…");
                                      Switch(
                                          varPerimetroRiep,
                                          "personale",
                                          // lavoratore: le proprie richieste (SDF_API02)
                                          If(
                                              !varMieCaricate,
                                              With(
                                                  {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                                  If(
                                                      rm.esito = "OK",
                                                      Set(varJsonMieRichieste, rm.dati);
                                                      Set(varMieCaricate, true),
                                                      Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                                                  )
                                              )
                                          );
                                      ClearCollect(
                                          colRiepilogo,
                                          ForAll(
                                              Filter(colMieRichieste, annoCompetenza = rie_ddAnno.Selected.Num, rie_ddMese.Selected.Num = 0 || meseCompetenza = rie_ddMese.Selected.Num) As x,
                                              {id: x.id, idRichiesta: x.idRichiesta, lavoratoreLogin: x.lavoratoreLogin, nominativo: x.nominativo, area: x.area, servizio: x.servizio, centroDiCosto: x.centroDiCosto, coordinatoreLogin: x.coordinatoreLogin, coordinatoreNome: x.coordinatoreNome, codiceCorso: x.codiceCorso, titolo: x.titolo, dataSessione: x.dataSessione, oreFrequentate: x.oreFrequentate, oreRetribuiteRichieste: x.oreRetribuiteRichieste, oreGettoneRichieste: x.oreGettoneRichieste, oreRetribuiteCoord: x.oreRetribuiteCoord, oreGettoneCoord: x.oreGettoneCoord, oreRetribuiteHR: x.oreRetribuiteHR, oreGettoneHR: x.oreGettoneHR, stato: x.stato, possibileDuplicato: x.possibileDuplicato, attestatoPresente: x.attestatoPresente}
                                          )
                                      ),
                                      "team",
                                      // coordinatore: solo il proprio gruppo (SDF_API05)
                                      Set(varAnnoTeam, rie_ddAnno.Selected.Num);
                                      Set(varMeseTeam, rie_ddMese.Selected.Num);
                                          With(
                                              {rt: IfError(SDF_API05_RichiesteTeam.Run(varAnnoTeam, varMeseTeam), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                              If(
                                                  rt.esito = "OK",
                                                  Set(varJsonTeam, rt.dati);
                                                  Set(varTeamCaricato, true),
                                                  Notify("Non è stato possibile caricare le richieste del team. " & rt.messaggio, NotificationType.Error)
                                              )
                                          );
                                          ClearCollect(colRiepilogo, ForAll(colRichiesteTeam As x, {id: x.id, idRichiesta: x.idRichiesta, lavoratoreLogin: x.lavoratoreLogin, nominativo: x.nominativo, area: x.area, servizio: x.servizio, centroDiCosto: x.centroDiCosto, coordinatoreLogin: x.coordinatoreLogin, coordinatoreNome: x.coordinatoreNome, codiceCorso: x.codiceCorso, titolo: x.titolo, dataSessione: x.dataSessione, oreFrequentate: x.oreFrequentate, oreRetribuiteRichieste: x.oreRetribuiteRichieste, oreGettoneRichieste: x.oreGettoneRichieste, oreRetribuiteCoord: x.oreRetribuiteCoord, oreGettoneCoord: x.oreGettoneCoord, oreRetribuiteHR: x.oreRetribuiteHR, oreGettoneHR: x.oreGettoneHR, stato: x.stato, possibileDuplicato: x.possibileDuplicato, attestatoPresente: x.attestatoPresente})),
                                          "hr",
                                          // HR / Amministratore: lettura diretta con filtri delegabili su anno e mese, poi stessa forma dei dati
                                          ClearCollect(
                                              colRiepSP,
                                              Filter(
                                                  'Richieste formazione',
                                                  'Anno di competenza' = rie_ddAnno.Selected.Num,
                                                  rie_ddMese.Selected.Num = 0 || 'Mese di competenza' = rie_ddMese.Selected.Num
                                              )
                                          );
                                          ClearCollect(
                                              colRiepilogo,
                                              ForAll(
                                                  colRiepSP As x,
                                                  {
                                                      id: x.ID,
                                                      idRichiesta: x.'ID richiesta',
                                                      lavoratoreLogin: Lower(x.'Login lavoratore'),
                                                      nominativo: Trim(x.Cognome & " " & x.Nome),
                                                      area: x.Area.Value,
                                                      servizio: x.Servizio,
                                                      centroDiCosto: x.'Centro di costo',
                                                      coordinatoreLogin: Lower(x.'Login coordinatore'),
                                                      coordinatoreNome: x.Coordinatore,
                                                      codiceCorso: x.'Codice univoco corso',
                                                      titolo: Coalesce(x.'Titolo del corso a catalogo', x.'Titolo corso libero'),
                                                      dataSessione: If(IsBlank(x.'Data sessione formativa'), Blank(), Date(Year(x.'Data sessione formativa'), Month(x.'Data sessione formativa'), Day(x.'Data sessione formativa'))),
                                                      oreFrequentate: Coalesce(x.'Ore frequentate dichiarate', 0),
                                                      oreRetribuiteRichieste: Coalesce(x.'Ore retribuite richieste', 0),
                                                      oreGettoneRichieste: Coalesce(x.'Ore gettone richieste', 0),
                                                      oreRetribuiteCoord: Coalesce(x.'Ore retribuite riconosciute coordinatore', 0),
                                                      oreGettoneCoord: Coalesce(x.'Ore gettone riconosciute coordinatore', 0),
                                                      oreRetribuiteHR: Coalesce(x.'Ore retribuite approvate HR', 0),
                                                      oreGettoneHR: Coalesce(x.'Ore gettone approvate HR', 0),
                                                      stato: x.'Stato richiesta'.Value,
                                                      possibileDuplicato: Coalesce(x.'Possibile duplicato', false),
                                                      attestatoPresente: Coalesce(x.'Attestato presente', false)
                                                  }
                                              )
                                          )
                                      );Reset(rie_ddArea);
                                      Reset(rie_ddServizio);
                                      Reset(rie_ddCdc);
                                      Reset(rie_ddCoord);
                                      Reset(rie_ddLavoratore);
                                      Reset(rie_ddStato);
                                      ClearCollect(colRiepFiltrato, colRiepilogo);
                                      Set(varCaricamento, false)
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Width: =160
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =Color.White
                                    Color: =colPrimario
                                    HoverFill: =colPrimarioChiaro
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                        - rie_lblInfo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =Switch(varPerimetroRiep, "personale", "Le tue richieste del periodo.", "team", "Richieste del tuo gruppo di lavoro (senza le bozze).", "Quadro completo di tutte le richieste del periodo (massimo 2000 righe per caricamento: per periodi più ampi filtrare per mese).")
                              Size: =11
                              Color: =colTestoSecondario
                              AutoHeight: =true
                              Wrap: =true
                              FillPortions: =0
                              Height: =20
                        - rie_rigaPeriodo:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =12
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =If(isMobile, 76 + 76 + 76, 64)
                            Children:
                              - rie_conCampoPerimetro:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =64
                                  Children:
                                    - rie_lblCampoPerimetro:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Dati"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - rie_ddPerimetro:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Items: =tblPerimetriRiep
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          ChevronBackground: =colPrimario
                                          ChevronFill: =Color.White
                                          Default: =LookUp(tblPerimetriRiep, Chiave = varPerimetroRiep).Value
                                          OnChange: =If(Self.Selected.Chiave <> varPerimetroRiep, Set(varPerimetroRiep, Self.Selected.Chiave); Select(rie_btnCarica))
                              - rie_conCampoAnno:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =64
                                  Children:
                                    - rie_lblCampoAnno:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Anno"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - rie_ddAnno:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Items: =tblAnni
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          ChevronBackground: =colPrimario
                                          ChevronFill: =Color.White
                                          Default: =Text(Year(Today()))
                                          OnChange: =Select(rie_btnCarica)
                              - rie_conCampoMese:
