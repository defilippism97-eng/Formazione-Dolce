          Properties:
            Text: |-
              ="(procedura)"
            OnSelect: |-
              =ClearCollect(
                  colRiepFiltrato,
                  Filter(
                      colRiepilogo,
                      IsBlank(rie_ddArea.Selected.Value) || area = rie_ddArea.Selected.Value,
                      IsBlank(rie_ddServizio.Selected.Value) || servizio = rie_ddServizio.Selected.Value,
                      IsBlank(rie_ddCdc.Selected.Value) || centroDiCosto = rie_ddCdc.Selected.Value,
                      IsBlank(rie_ddCoord.Selected.Value) || coordinatoreNome = rie_ddCoord.Selected.Value,
                      IsBlank(rie_ddLavoratore.Selected.Value) || nominativo = rie_ddLavoratore.Selected.Value,
                      IsBlank(rie_ddStato.Selected.Value) || stato = rie_ddStato.Selected.Value
                  )
