# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrValidazioneHR
#  6 – Validazione HR singola e per perimetro (HR / Amministratore)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: lettura diretta delegabile di 'Richieste formazione' (HR); scritture solo con SDF_API07_EsitoHR.
# =============================================================================
Screens:
  scrValidazioneHR:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        UpdateContext({locDialogo: "", locAzione: "", locEsito: ""});
        Clear(colSelezioneHR);
        Clear(colDaElaborareHR);
        Refresh('Richieste formazione')
    Children:
      - val_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - val_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - val_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - val_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - val_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - val_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - val_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - val_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - val_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "validazione", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Navigate(scrRichiesta, ScreenTransition.None),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - val_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "validazione", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - val_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "validazione", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "validazione", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - val_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = "validazione"
                  - val_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - val_lblTitolo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Validazione HR"
                              Size: =18
                              Color: =colPrimario
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              FillPortions: =0
                        - val_lblInfo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Richieste approvate dai coordinatori e in attesa di validazione. Puoi correggere le ore HR riga per riga (la riga viene selezionata) e validare, respingere o chiedere un’integrazione per le righe selezionate o per un intero perimetro. Le icone segnalano possibili duplicati, attestati mancanti e anomalie."
                              Size: =11
                              Color: =colTestoSecondario
                              AutoHeight: =true
                              Wrap: =true
                              FillPortions: =0
                              Height: =20
                        - val_conFiltri:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + val_lblSezFiltri.Height + 8 + val_rigaFiltri1.Height + 8 + val_rigaFiltri2.Height + 8 + val_conPulisci.Height + 8
                            Children:
                              - val_lblSezFiltri:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Filtri"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
                                    VerticalAlign: =VerticalAlign.Bottom
                              - val_rigaFiltri1:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + 76 + 76 + 76, 64)
                                  Children:
                                    - val_conCampoAnno:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoAnno:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Anno"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_ddAnno:
                                              Control: Classic/DropDown@2.3.1
                                              Properties:
                                                Items: =tblAnniFiltro
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                ChevronBackground: =colPrimario
                                                ChevronFill: =Color.White
                                                Default: =Text(Year(Today()))
                                    - val_conCampoMese:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoMese:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Mese"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_ddMese:
                                              Control: Classic/DropDown@2.3.1
                                              Properties:
                                                Items: =tblMesiFiltro
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                ChevronBackground: =colPrimario
                                                ChevronFill: =Color.White
                                                Default: |-
                                                  ="Tutti i mesi"
                                    - val_conCampoArea:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoArea:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Area (vuoto = tutte)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_ddArea:
                                              Control: Classic/DropDown@2.3.1
                                              Properties:
                                                Items: =Choices('Richieste formazione'.Area)
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                ChevronBackground: =colPrimario
                                                ChevronFill: =Color.White
                                                Default: |-
                                                  =""
                                                AllowEmptySelection: =true
                                    - val_conCampoServizio:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoServizio:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Servizio (inizia con)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_txtServizio:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: |-
                                                  =""
                                                HintText: |-
                                                  ="Es. Nido"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                DelayOutput: =true
                              - val_rigaFiltri2:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + 76 + 76 + 76, 64)
                                  Children:
                                    - val_conCampoCdc:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoCdc:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Centro di costo (inizia con)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_txtCdc:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: |-
                                                  =""
                                                HintText: |-
                                                  ="Es. CEN-"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                DelayOutput: =true
                                    - val_conCampoCoord:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Coordinatore (login o nome)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_txtCoord:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: |-
                                                  =""
                                                HintText: |-
                                                  ="Es. anna.bianchi"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                DelayOutput: =true
                                    - val_conCampoLavoratore:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoLavoratore:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Lavoratore (cognome o login)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_txtLavoratore:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: |-
                                                  =""
                                                HintText: |-
                                                  ="Es. Rossi"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                DelayOutput: =true
                                    - val_conCampoCodice:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoCodice:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Codice corso (inizia con)"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_txtCodice:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: |-
                                                  =""
                                                HintText: |-
                                                  ="Es. EXT-"
                                                Size: =12
                                                BorderColor: =colBordo
                                                Height: =36
                                                FillPortions: =0
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                DelayOutput: =true
                              - val_conPulisci:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Height: =40
                                    FillPortions: =0
                                  Children:
                                    - val_btnPulisci:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: |-
                                            ="Pulisci filtri"
                                          OnSelect: |-
                                            =Reset(val_ddAnno);
                                            Reset(val_ddMese);
                                            Reset(val_ddArea);
                                            Reset(val_txtServizio);
                                            Reset(val_txtCdc);
                                            Reset(val_txtCoord);
                                            Reset(val_txtLavoratore);
                                            Reset(val_txtCodice)
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          Width: =150
                                          FillPortions: =0
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DisabledFill: =RGBA(200, 200, 200, 1)
                                          DisabledColor: =RGBA(110, 110, 110, 1)
                                          Fill: =Color.White
                                          Color: =colPrimario
                                          HoverFill: =colPrimarioChiaro
                                          PressedFill: =colPrimarioChiaro
                                          HoverColor: =colPrimario
                                          BorderColor: =colPrimario
                                          BorderThickness: =1
                                    - val_lblConteggio:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Richieste in elenco: " & CountRows(val_galRichieste.AllItems) & If(CountRows(val_galRichieste.AllItems) >= 100, " (scorri per caricarne altre)", "")
                                          Size: =11
                                          Color: =colTestoSecondario
                                          FillPortions: =1
                                          Height: =36
                        - val_conAzioni:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + val_lblSezAzioni.Height + 8 + val_rigaAmbito.Height + 8 + val_conCampoNota.Height + 8 + val_conPulsanti.Height + 8
                            Children:
                              - val_lblSezAzioni:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Azioni su più richieste"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
                                    VerticalAlign: =VerticalAlign.Bottom
                              - val_rigaAmbito:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + If(val_conCampoTipoPerimetro.Visible, 76, 0) + If(val_conCampoValorePerimetro.Visible, 76, 0), 64)
                                  Children:
                                    - val_conCampoAmbito:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - val_lblCampoAmbito:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Applica a"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - val_ddAmbito:
                                              Control: Classic/DropDown@2.3.1
