                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoServizio:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Servizio"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblServizio:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.servizio, "—")
                                                Size: =12
                                                Color: =colTesto
                                                FillPortions: =0
                                                Height: =36
                                    - ric_conCampoCdc:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoCdc:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Centro di costo"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblCdc:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.centroDiCosto, "—")
                                                Size: =12
                                                Color: =colTesto
                                                FillPortions: =0
                                                Height: =36
                                    - ric_conCampoCoord:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Coordinatore"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblCoord:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.coordinatoreNome, "Non assegnato")
                                                Size: =12
                                                Color: =colTesto
                                                FillPortions: =0
                                                Height: =36
                              - ric_lblSegnala:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Dati organizzativi non corretti? Segnala la variazione a HR dal tuo profilo ›"
                                    Size: =11
                                    Color: =colInfo
                                    Underline: =true
                                    Height: =24
                                    FillPortions: =0
                                    OnSelect: =Navigate(scrProfilo, ScreenTransition.None)
                        - ric_conCorso:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + ric_lblSezCorso.Height + 8 + ric_rigaEnte.Height + 8 + If(ric_rigaInfoCatalogo.Visible, ric_rigaInfoCatalogo.Height + 8, 0) + If(ric_rigaInfoStorico.Visible, ric_rigaInfoStorico.Height + 8, 0) + If(ric_rigaNuovoCorso.Visible, ric_rigaNuovoCorso.Height + 8, 0) + If(ric_rigaNuovoCorso2.Visible, ric_rigaNuovoCorso2.Height + 8, 0) + If(ric_lblInfoNuovoCorso.Visible, ric_lblInfoNuovoCorso.Height + 8, 0)
                            Children:
                              - ric_lblSezCorso:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Attività formativa"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
                                    VerticalAlign: =VerticalAlign.Bottom
                              - ric_rigaEnte:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + If(ric_conCampoCorsoCatalogo.Visible, 76, 0) + If(ric_conCampoTipoEsterno.Visible, 76, 0) + If(ric_conCampoCorsoStorico.Visible, 76, 0), 64)
