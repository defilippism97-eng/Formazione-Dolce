# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrRichiesta
#  3 – Nuova richiesta / modifica (lavoratore)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: SDF_API03 (bozza/invia/annulla con allegati); letture dirette solo di 'Catalogo corsi' e 'Chiusure mensili'.
# =============================================================================
Screens:
  scrRichiesta:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        UpdateContext({locDialogo: "", locAzione: "", locConfermaDup: false, locAllegatiInviati: false, locMsgDialogo: ""});
        ClearCollect(
            colMesiChiusi,
            ShowColumns(Filter('Chiusure mensili', 'Stato del periodo'.Value = "Chiuso"), Periodo, Anno, Mese)
        );
        // in modifica: la richiesta deve essere tra quelle caricate con SDF_API02
        If(
            varIdModifica > 0 && IsBlank(LookUp(colMieRichieste, id = varIdModifica)),
            Set(varCaricamento, true);
            Set(varMessaggioCaricamento, "Caricamento della richiesta…");
            With(
                {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                If(
                    rm.esito = "OK",
                    Set(varJsonMieRichieste, rm.dati);
                    Set(varMieCaricate, true),
                    Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                )
            );
            Set(varCaricamento, false)
        );
        If(
            varIdModifica > 0 && IsBlank(LookUp(colMieRichieste, id = varIdModifica)),
            Notify("Richiesta non trovata: si apre un modulo vuoto.", NotificationType.Warning);
            Set(varIdModifica, 0)
        );
        Set(varRicEdit, LookUp(colMieRichieste, id = varIdModifica));
        // sola lettura se lo stato non è modificabile (§1.5) o se il mese della richiesta è chiuso (R9)
        UpdateContext({
            locSolaLettura: varIdModifica > 0 && (
                !varRicEdit.modificabile ||
                !IsBlank(LookUp(colMesiChiusi, Anno = varRicEdit.annoCompetenza && Mese = varRicEdit.meseCompetenza))
            )
        });
        Reset(ric_ddEnte);
        Reset(ric_cmbCorsoCatalogo);
        Reset(ric_tglStorico);
        Reset(ric_cmbCorsoStorico);
        Reset(ric_txtTitoloLibero);
        Reset(ric_ddModalita);
        Reset(ric_txtDurataCorso);
        Reset(ric_tglPiuGiornate);
        Reset(ric_txtNomeEnte);
        Reset(ric_dtpData);
        Reset(ric_ddIniH);
        Reset(ric_ddIniM);
        Reset(ric_ddFinH);
        Reset(ric_ddFinM);
        Reset(ric_ddIngH);
        Reset(ric_ddIngM);
        Reset(ric_ddUscH);
        Reset(ric_ddUscM);
        Reset(ric_txtOreRetribuite);
        Reset(ric_txtOreGettone);
        Reset(ric_txtNote);
        Reset(ric_chkPartecipazione);
        Reset(ric_chkCorrettezza);
        Reset(ric_chkAutorizzazione);
        Reset(ric_attAttestato);
        Reset(ric_attAltraDoc)
    Children:
      - ric_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - ric_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - ric_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - ric_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - ric_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - ric_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - ric_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - ric_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - ric_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "nuova", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Select(ric_btnInizializza),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - ric_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "nuova", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - ric_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "nuova", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "nuova", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - ric_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = "nuova"
                  - ric_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - ric_conTitolo:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =40
                              FillPortions: =0
                            Children:
                              - ric_lblTitolo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(varIdModifica = 0, "Nuova richiesta di formazione", "Richiesta " & varRicEdit.idRichiesta)
                                    Size: =18
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    FillPortions: =1
                              - ric_lblStato:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =varRicEdit.stato
                                    Size: =10
                                    Color: =Color.White
                                    FontWeight: =FontWeight.Semibold
                                    Fill: =varRicEdit.colore
                                    Align: =Align.Center
                                    Width: =220
                                    Height: =28
                                    Visible: =varIdModifica > 0
                        - ric_lblSolaLettura:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Questa richiesta è in sola lettura: lo stato «" & varRicEdit.stato & "» non consente modifiche oppure il mese è chiuso."
                              Size: =12
                              Color: =Color.White
                              FontWeight: =FontWeight.Semibold
                              Fill: =colTestoSecondario
                              PaddingLeft: =12
                              Height: =40
                              Wrap: =true
                              FillPortions: =0
                              Visible: =locSolaLettura
                        - ric_lblNoteRitorno:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =Trim(If(!IsBlank(varRicEdit.noteCoordinatore), "Nota del coordinatore: " & varRicEdit.noteCoordinatore & Char(10), "") & If(!IsBlank(varRicEdit.noteHR), "Nota HR: " & varRicEdit.noteHR, ""))
                              Size: =12
                              Color: =colTesto
                              Fill: =RGBA(202, 80, 16, 0.10)
                              BorderColor: =colAvviso
                              BorderThickness: =1
                              PaddingLeft: =12
                              PaddingTop: =8
                              PaddingBottom: =8
                              AutoHeight: =true
                              Wrap: =true
                              Height: =40
                              FillPortions: =0
                              Visible: =varIdModifica > 0 && !IsBlank(Self.Text)
                        - ric_conLavoratore:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =colSuperficie
                              BorderColor: =colBordo
                              BorderThickness: =1
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              FillPortions: =0
                              Height: =18 + ric_lblSezLavoratore.Height + 8 + ric_rigaLav1.Height + 8 + ric_rigaLav2.Height + 8 + ric_lblSegnala.Height + 8
                            Children:
                              - ric_lblSezLavoratore:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="Dati del lavoratore"
                                    Size: =14
                                    Color: =colPrimario
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    FillPortions: =0
                                    VerticalAlign: =VerticalAlign.Bottom
                              - ric_rigaLav1:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + 76 + 76, 64)
                                  Children:
                                    - ric_conCampoNominativo:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoNominativo:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Nome e cognome"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblNominativo:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(Trim(recProfilo.nome & " " & recProfilo.cognome), User().FullName)
                                                Size: =12
                                                Color: =colTesto
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                Height: =36
                                    - ric_conCampoEmailPers:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoEmailPers:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="E-mail di contatto"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblEmailPers:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.emailPersonale, "—")
                                                Size: =12
                                                Color: =colTesto
                                                FillPortions: =0
                                                Height: =36
                                    - ric_conCampoCF:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoCF:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Codice fiscale"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblCF:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.cfMascherato, "—")
                                                Size: =12
                                                Color: =colTesto
                                                FillPortions: =0
                                                Height: =36
                              - ric_rigaLav2:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =12
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =If(isMobile, 76 + 76 + 76 + 76, 64)
                                  Children:
                                    - ric_conCampoArea:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =4
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =64
                                        Children:
                                          - ric_lblCampoArea:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |-
                                                  ="Area"
                                                Size: =11
                                                Color: =colTestoSecondario
                                                Height: =20
                                                FillPortions: =0
                                          - ric_lblArea:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(recProfilo.area, "—")
                                                Size: =12
