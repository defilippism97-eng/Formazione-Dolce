                                    OnSelect: |-
                                      =UpdateContext({locAzione: "bozza", locConfermaDup: false}); Select(ric_btnEsegui)
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =160
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =Color.White
                                    Color: =colPrimario
                                    HoverFill: =colPrimarioChiaro
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                                    DisplayMode: =If(locSolaLettura || !IsBlank(ric_lblErrori.Text), DisplayMode.Disabled, DisplayMode.Edit)
                              - ric_btnInvia:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Invia al coordinatore"
                                    OnSelect: |-
                                      =UpdateContext({locAzione: "invia", locConfermaDup: false}); Select(ric_btnEsegui)
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =210
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =colPrimario
                                    Color: =Color.White
                                    HoverFill: =colPrimarioScuro
                                    PressedFill: =colPrimarioScuro
                                    BorderThickness: =0
                                    DisplayMode: =If(locSolaLettura || !IsBlank(ric_lblErrori.Text) || !IsBlank(ric_lblErroriInvio.Text), DisplayMode.Disabled, DisplayMode.Edit)
                              - ric_btnAnnullaRic:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Annulla richiesta"
                                    OnSelect: |-
                                      =UpdateContext({locDialogo: "annulla"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =colErrore
                                    Color: =Color.White
                                    HoverFill: =ColorFade(colErrore, -15%)
                                    PressedFill: =ColorFade(colErrore, -25%)
                                    BorderThickness: =0
                                    Visible: =varIdModifica > 0 && varRicEdit.annullabile && IsBlank(LookUp(colMesiChiusi, Anno = varRicEdit.annoCompetenza && Mese = varRicEdit.meseCompetenza))
                              - ric_btnTorna:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Torna alle richieste"
                                    OnSelect: =Navigate(scrMieRichieste, ScreenTransition.None)
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =190
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =Color.White
                                    Color: =colPrimario
                                    HoverFill: =colPrimarioChiaro
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
      - ric_btnEsegui:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              ="(procedura)"
            OnSelect: |-
              =// Procedura di salvataggio (locAzione = "bozza" oppure "invia"), richiamata con Select(ric_btnEsegui).
              // Gli allegati diventano data URI: JSON(..., IncludeBinaryData) restituisce "data:...;base64,..." tra virgolette.
              With(
                  {
                      attUri: If(locAllegatiInviati || CountRows(ric_attAttestato.Attachments) = 0, "", With({j: JSON(First(ric_attAttestato.Attachments).Value, JSONFormat.IncludeBinaryData)}, Mid(j, 2, Len(j) - 2))),
                      attNome: If(locAllegatiInviati || CountRows(ric_attAttestato.Attachments) = 0, "", First(ric_attAttestato.Attachments).Name),
                      altraUri: If(locAllegatiInviati || CountRows(ric_attAltraDoc.Attachments) = 0, "", With({j: JSON(First(ric_attAltraDoc.Attachments).Value, JSONFormat.IncludeBinaryData)}, Mid(j, 2, Len(j) - 2))),
                      altraNome: If(locAllegatiInviati || CountRows(ric_attAltraDoc.Attachments) = 0, "", First(ric_attAltraDoc.Attachments).Name)
                  },
                  If(
                      Len(attUri) > 14000000 || Len(altraUri) > 14000000,
                      Notify("Ogni allegato può pesare al massimo 10 MB: riduci il file (es. PDF compresso) e riprova.", NotificationType.Error),
                      Set(varCaricamento, true);
                      Set(varMessaggioCaricamento, If(locAzione = "invia", "Invio al coordinatore in corso…", "Salvataggio della bozza in corso…"));
                      With(
                          {r: IfError(
                              SDF_API03_SalvaRichiesta.Run(
                                  JSON(
                                      {
                                          id: varIdModifica,
                                          enteErogatore: ric_ddEnte.Selected.Value,
                                          corsoId: If(ric_ddEnte.Selected.Value = "Datore di lavoro", Coalesce(ric_cmbCorsoCatalogo.Selected.ID, 0), ric_tglStorico.Value, Coalesce(ric_cmbCorsoStorico.Selected.ID, 0), 0),
                                          nuovoCorso: If(
                                              !(ric_ddEnte.Selected.Value = "Datore di lavoro") && !ric_tglStorico.Value,
                                              {
                                                  titolo: Trim(ric_txtTitoloLibero.Text),
                                                  modalita: ric_ddModalita.Selected.Value,
                                                  durata: Coalesce(Value(ric_txtDurataCorso.Text), 0),
                                                  piuGiornate: ric_tglPiuGiornate.Value,
                                                  nomeEnte: Trim(ric_txtNomeEnte.Text)
                                              },
                                              Blank()
                                          ),
                                          dataSessione: Text(ric_dtpData.SelectedDate, "yyyy-mm-dd"),
                                          oraInizioSessione: ric_ddIniH.Selected.Value & ":" & ric_ddIniM.Selected.Value,
                                          oraFineSessione: ric_ddFinH.Selected.Value & ":" & ric_ddFinM.Selected.Value,
                                          oraIngresso: ric_ddIngH.Selected.Value & ":" & ric_ddIngM.Selected.Value,
                                          oraUscita: ric_ddUscH.Selected.Value & ":" & ric_ddUscM.Selected.Value,
                                          oreRetribuiteRichieste: Coalesce(Value(ric_txtOreRetribuite.Text), 0),
                                          oreGettoneRichieste: If((ric_ddEnte.Selected.Value = "Datore di lavoro" && !IsBlank(ric_cmbCorsoCatalogo.Selected.ID) && !ric_cmbCorsoCatalogo.Selected.'Gettone previsto'), 0, Coalesce(Value(ric_txtOreGettone.Text), 0)),
                                          noteLavoratore: Trim(ric_txtNote.Text),
                                          confermaPartecipazione: ric_chkPartecipazione.Value,
                                          confermaCorrettezza: ric_chkCorrettezza.Value,
                                          autorizzazioneInvio: ric_chkAutorizzazione.Value,
                                          confermaDuplicato: locConfermaDup
                                      },
                                      JSONFormat.IgnoreBinaryData
                                  ),
                                  locAzione,
                                  attUri,
                                  attNome,
                                  altraUri,
                                  altraNome
                              ),
                              {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                          )},
                          With(
                              {d: IfError(ParseJSON(r.dati), ParseJSON("{}"))},
                              If(
                                  r.esito = "OK",
                                  With(
                                      {avvisi: IfError(Concat(Table(d.avvisi) As a, Text(a.Value), " · "), "")},
                                      Notify(
                                          If(locAzione = "invia", "Richiesta " & Text(d.idRichiesta) & " inviata al coordinatore.", "Bozza " & Text(d.idRichiesta) & " salvata.") &
                                          If(IsBlank(avvisi), "", " Attenzione: " & avvisi),
                                          If(IsBlank(avvisi), NotificationType.Success, NotificationType.Warning)
                                      )
                                  );
                                  With(
                                      {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                      If(
                                          rm.esito = "OK",
                                          Set(varJsonMieRichieste, rm.dati);
                                          Set(varMieCaricate, true),
                                          Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                                      )
                                  );
                                  Reset(ric_attAttestato);
                                  Reset(ric_attAltraDoc);
                                  Set(varIdModifica, 0);
                                  Navigate(scrMieRichieste, ScreenTransition.None),
                                  // R7: il flusso chiede conferma del possibile duplicato (la bozza è già salvata)
                                  Text(d.richiestaConferma) = "duplicato",
                                  If(Coalesce(Value(d.id), 0) > 0, Set(varIdModifica, Value(d.id)); UpdateContext({locAllegatiInviati: true}));
                                  UpdateContext({locMsgDialogo: r.messaggio, locDialogo: "duplicato"}),
                                  Notify(r.messaggio, NotificationType.Error)
                              )
                          )
                      );
                      Set(varCaricamento, false)
                  )
              )
            Size: =12
            FontWeight: =FontWeight.Semibold
            Height: =10
            Width: =10
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            DisabledFill: =RGBA(200, 200, 200, 1)
            DisabledColor: =RGBA(110, 110, 110, 1)
            Fill: =colPrimario
            Color: =Color.White
            HoverFill: =colPrimarioScuro
            PressedFill: =colPrimarioScuro
            BorderThickness: =0
            Visible: =false
            X: =0
            Y: =0
      - ric_btnInizializza:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              ="(procedura)"
            OnSelect: |-
              =Set(varMenuAperto, false);
              UpdateContext({locDialogo: "", locAzione: "", locConfermaDup: false, locAllegatiInviati: false, locMsgDialogo: ""});
              ClearCollect(
                  colMesiChiusi,
                  ShowColumns(Filter('Chiusure mensili', 'Stato del periodo'.Value = "Chiuso"), Periodo, Anno, Mese)
              );
              // in modifica: la richiesta deve essere tra quelle caricate con SDF_API02
              If(
                  varIdModifica > 0 && IsBlank(LookUp(colMieRichieste, id = varIdModifica)),
                  Set(varCaricamento, true);
                  Set(varMessaggioCaricamento, "Caricamento della richiesta…");
                  With(
                      {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                      If(
                          rm.esito = "OK",
                          Set(varJsonMieRichieste, rm.dati);
                          Set(varMieCaricate, true),
                          Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                      )
                  );
                  Set(varCaricamento, false)
              );
              If(
                  varIdModifica > 0 && IsBlank(LookUp(colMieRichieste, id = varIdModifica)),
                  Notify("Richiesta non trovata: si apre un modulo vuoto.", NotificationType.Warning);
                  Set(varIdModifica, 0)
              );
              Set(varRicEdit, LookUp(colMieRichieste, id = varIdModifica));
              // sola lettura se lo stato non è modificabile (§1.5) o se il mese della richiesta è chiuso (R9)
              UpdateContext({
                  locSolaLettura: varIdModifica > 0 && (
                      !varRicEdit.modificabile ||
                      !IsBlank(LookUp(colMesiChiusi, Anno = varRicEdit.annoCompetenza && Mese = varRicEdit.meseCompetenza))
                  )
              });
              Reset(ric_ddEnte);
              Reset(ric_cmbCorsoCatalogo);
              Reset(ric_tglStorico);
              Reset(ric_cmbCorsoStorico);
              Reset(ric_txtTitoloLibero);
              Reset(ric_ddModalita);
              Reset(ric_txtDurataCorso);
              Reset(ric_tglPiuGiornate);
              Reset(ric_txtNomeEnte);
              Reset(ric_dtpData);
              Reset(ric_ddIniH);
              Reset(ric_ddIniM);
              Reset(ric_ddFinH);
              Reset(ric_ddFinM);
              Reset(ric_ddIngH);
              Reset(ric_ddIngM);
              Reset(ric_ddUscH);
              Reset(ric_ddUscM);
              Reset(ric_txtOreRetribuite);
              Reset(ric_txtOreGettone);
              Reset(ric_txtNote);
              Reset(ric_chkPartecipazione);
              Reset(ric_chkCorrettezza);
              Reset(ric_chkAutorizzazione);
              Reset(ric_attAttestato);
              Reset(ric_attAltraDoc)
            Size: =12
            FontWeight: =FontWeight.Semibold
            Height: =10
            Width: =10
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            DisabledFill: =RGBA(200, 200, 200, 1)
            DisabledColor: =RGBA(110, 110, 110, 1)
            Fill: =colPrimario
            Color: =Color.White
            HoverFill: =colPrimarioScuro
            PressedFill: =colPrimarioScuro
            BorderThickness: =0
            Visible: =false
            X: =0
            Y: =0
      - ric_conDialogo:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =!IsBlank(locDialogo)
          Children:
            - ric_rctDialogoVelo:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colVelo
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - ric_conDialogoBox:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.Bold
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(520, Parent.Width - 32)
                  Height: =If(ric_txtDialogoNota.Visible, 380, 290)
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - ric_lblDialogoTitolo:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(locDialogo = "duplicato", "Possibile duplicato", "Annullare la richiesta?")
                        Size: =16
                        Color: =colPrimario
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        FillPortions: =0
                  - ric_lblDialogoTesto:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(locDialogo = "duplicato", locMsgDialogo & " Se confermi, la richiesta viene inviata e segnalata come possibile duplicato al coordinatore e all’Ufficio HR.", "La richiesta " & varRicEdit.idRichiesta & " passerà allo stato «Annullata». Se era già stata inviata, il coordinatore riceverà un avviso.")
                        Size: =12
                        Color: =colTesto
                        Wrap: =true
                        FillPortions: =1
                        VerticalAlign: =VerticalAlign.Top
                        LayoutMinHeight: =60
                  - ric_txtDialogoNota:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: |-
                          =""
                        HintText: |-
                          ="Motivazione"
                        Size: =12
                        BorderColor: =colBordo
                        Height: =80
                        FillPortions: =0
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        Mode: =TextMode.MultiLine
                        Visible: =false
                  - ric_conDialogoPulsanti:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =44
                        FillPortions: =0
                      Children:
                        - ric_btnDialogoAnnulla:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Annulla"
                              OnSelect: |-
                                =UpdateContext({locDialogo: ""})
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =140
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =Color.White
                              Color: =colPrimario
                              HoverFill: =colPrimarioChiaro
                              PressedFill: =colPrimarioChiaro
                              HoverColor: =colPrimario
                              BorderColor: =colPrimario
                              BorderThickness: =1
                        - ric_btnDialogoConferma:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =If(locDialogo = "duplicato", "Conferma invio", "Sì, annulla")
                              OnSelect: |-
                                =If(
                                    locDialogo = "duplicato",
                                    // conferma del possibile duplicato: si ripete l'invio con confermaDuplicato = true
                                    UpdateContext({locConfermaDup: true, locAzione: "invia", locDialogo: ""});
                                    Select(ric_btnEsegui),
                                    Set(varCaricamento, true);
                                    Set(varMessaggioCaricamento, "Annullamento in corso…");
                                    With(
                                        {r: IfError(
                                            SDF_API03_SalvaRichiesta.Run(JSON({id: varIdModifica}, JSONFormat.IgnoreBinaryData), "annulla", "", "", "", ""),
                                            {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"}
                                        )},
                                        If(
                                            r.esito = "OK",
                                            Notify("Richiesta annullata.", NotificationType.Success);
                                            With(
                                                {rm: IfError(SDF_API02_MieRichieste.Run(0), {esito: "ERRORE", messaggio: testoErroreRete, dati: "{}"})},
                                                If(
                                                    rm.esito = "OK",
                                                    Set(varJsonMieRichieste, rm.dati);
                                                    Set(varMieCaricate, true),
                                                    Notify("Non è stato possibile caricare le tue richieste. " & rm.messaggio, NotificationType.Error)
                                                )
                                            );
                                            UpdateContext({locDialogo: ""});
                                            Set(varIdModifica, 0);
                                            Navigate(scrMieRichieste, ScreenTransition.None),
                                            Notify(r.messaggio, NotificationType.Error)
                                        )
                                    );
                                    Set(varCaricamento, false)
                                )
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =180
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =If(locDialogo = "duplicato", colPrimario, colErrore)
                              Color: =Color.White
                              HoverFill: =colPrimarioScuro
                              PressedFill: =colPrimarioScuro
                              BorderThickness: =0
                              DisplayMode: =If(true, DisplayMode.Edit, DisplayMode.Disabled)
      - ric_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - ric_rctCaricamento:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 0.65)
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - ric_lblCaricamento:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(varMessaggioCaricamento, "Caricamento in corso…") & Char(10) & "Attendere qualche secondo."
                  Size: =14
                  Color: =colPrimario
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(360, Parent.Width - 32)
                  Height: =96
                  Wrap: =true
                  BorderColor: =colBordo
                  BorderThickness: =1
