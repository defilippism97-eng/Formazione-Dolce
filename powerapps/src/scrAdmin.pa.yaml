                                          Default: =locCfg.Valore
                                          HintText: |-
                                            =""
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =160
                                          FillPortions: =0
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          Mode: =TextMode.MultiLine
                                    - adm_conCfgPulsanti:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =8
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Height: =48
                                          FillPortions: =0
                                        Children:
                                          - adm_btnSalvaCfg:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                Text: |-
                                                  ="Salva"
                                                OnSelect: |-
                                                  =With(
                                                      {prima: locCfg},
                                                      With(
                                                          {salvato: IfError(
                                                              Patch(Configurazione, LookUp(Configurazione, ID = prima.ID), {Valore: adm_txtCfgValore.Text}),
                                                              Notify("Salvataggio non riuscito: " & FirstError.Message, NotificationType.Error);
                                                              Blank()
                                                          )},
                                                          If(
                                                              !IsBlank(salvato),
                                                              IfError(
                                                                  Patch(
                                                                      'Registro modifiche',
                                                                      Defaults('Registro modifiche'),
                                                                      {
                                                                          Azione: "Modifica configurazione",
                                                                          Lista: "Configurazione",
                                                                          'ID elemento': Text(prima.ID),
                                                                          Campo: prima.Chiave,
                                                                          'Valore precedente': prima.Valore,
                                                                          'Valore nuovo': salvato.Valore,
                                                                          Ruolo: {Value: "Amministratore"},
                                                                          'Login autore': recProfilo.login,
                                                                          Nota: ""
                                                                      }
                                                                  ),
                                                                  Notify("Parametro salvato, ma il Registro modifiche non è stato aggiornato: " & FirstError.Message, NotificationType.Warning),
                                                                  Notify("Parametro " & prima.Chiave & " salvato. I flussi lo leggono alla prossima esecuzione.", NotificationType.Success)
                                                              );
                                                              UpdateContext({locCfg: salvato})
                                                          )
                                                      )
                                                  )
                                                Size: =12
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                Width: =140
                                                FillPortions: =0
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                DisabledFill: =RGBA(200, 200, 200, 1)
                                                DisabledColor: =RGBA(110, 110, 110, 1)
                                                Fill: =colPrimario
                                                Color: =Color.White
                                                HoverFill: =colPrimarioScuro
                                                PressedFill: =colPrimarioScuro
                                                BorderThickness: =0
                                          - adm_btnChiudiCfg:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                Text: |-
                                                  ="Chiudi"
                                                OnSelect: |-
                                                  =UpdateContext({locCfg: Blank()})
                                                Size: =12
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                Width: =120
                                                FillPortions: =0
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                DisabledFill: =RGBA(200, 200, 200, 1)
                                                DisabledColor: =RGBA(110, 110, 110, 1)
                                                Fill: =Color.White
                                                Color: =colPrimario
                                                HoverFill: =colPrimarioChiaro
                                                PressedFill: =colPrimarioChiaro
                                                HoverColor: =colPrimario
                                                BorderColor: =colPrimario
                                                BorderThickness: =1
      - adm_conDialogo:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =!IsBlank(locDialogo)
          Children:
            - adm_rctDialogoVelo:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colVelo
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - adm_conDialogoBox:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.Bold
                  Fill: =colSuperficie
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Min(520, Parent.Width - 32)
                  Height: =If(adm_txtDialogoNota.Visible, 380, 290)
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - adm_lblDialogoTitolo:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Eliminare l’elemento?"
                        Size: =16
                        Color: =colPrimario
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        FillPortions: =0
                  - adm_lblDialogoTesto:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Stai per eliminare «" & locEliminaNome & "» dalla lista " & locEliminaLista & ". L’operazione è definitiva e viene registrata nel Registro modifiche."
                        Size: =12
