                                          Items: =Sort(Configurazione, Chiave)
                                          TemplateSize: =56
                                          TemplatePadding: =0
                                          ShowScrollbar: =true
                                          BorderColor: =colBordo
                                          BorderThickness: =0
                                          Fill: =colSuperficie
                                          OnSelect: |-
                                            =UpdateContext({locCfg: ThisItem}); Reset(adm_txtCfgValore)
                                          TemplateFill: =If(ThisItem.ID = locCfg.ID, colPrimarioChiaro, RGBA(0, 0, 0, 0))
                                          FillPortions: =1
                                        Children:
                                          - adm_lblCfgChiave:
                                              Control: Label@2.5.1
