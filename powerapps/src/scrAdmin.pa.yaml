                                    LayoutMinWidth: =320
                                    Height: =100
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    Visible: =!IsBlank(locCfg.ID)
                                  Children:
                                    - adm_lblEditCfg:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Parametro: " & locCfg.Chiave
                                          Size: =14
                                          Color: =colPrimario
                                          FontWeight: =FontWeight.Semibold
                                          Height: =32
                                          FillPortions: =0
