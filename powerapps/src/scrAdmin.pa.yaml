                        FillPortions: =0
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        Mode: =TextMode.MultiLine
                        Visible: =false
                  - adm_conDialogoPulsanti:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =44
                        FillPortions: =0
                      Children:
                        - adm_btnDialogoAnnulla:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Annulla"
                              OnSelect: |-
                                =UpdateContext({locDialogo: ""})
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =140
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =Color.White
                              Color: =colPrimario
                              HoverFill: =colPrimarioChiaro
                              PressedFill: =colPrimarioChiaro
                              HoverColor: =colPrimario
                              BorderColor: =colPrimario
                              BorderThickness: =1
                        - adm_btnDialogoConferma:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                ="Elimina"
                              OnSelect: |-
                                =IfError(
                                    Switch(
                                        locEliminaLista,
                                        "Strutture organizzative", Remove('Strutture organizzative', LookUp('Strutture organizzative', ID = locEliminaId)),
                                        "Catalogo corsi", Remove('Catalogo corsi', LookUp('Catalogo corsi', ID = locEliminaId)),
                                        "Ruoli applicativi", Remove('Ruoli applicativi', LookUp('Ruoli applicativi', ID = locEliminaId))
                                    ),
                                    Notify("Eliminazione non riuscita: " & FirstError.Message, NotificationType.Error),
                                    Patch(
                                        'Registro modifiche',
                                        Defaults('Registro modifiche'),
                                        {
                                            Azione: "Eliminazione",
                                            Lista: locEliminaLista,
                                            'ID elemento': Text(locEliminaId),
                                            Campo: "",
                                            'Valore precedente': locEliminaNome,
                                            'Valore nuovo': "",
                                            Ruolo: {Value: "Amministratore"},
                                            'Login autore': recProfilo.login,
                                            Nota: ""
                                        }
                                    ),
                                    Notify("Elemento eliminato, ma il Registro modifiche non è stato aggiornato: " & FirstError.Message, NotificationType.Warning),
                                    Notify("Elemento eliminato.", NotificationType.Success);
                                    UpdateContext({locDialogo: "", locStr: Blank(), locCorso: Blank(), locRuolo: Blank(), locNuovaStr: false, locNuovoCorso: false, locNuovoRuolo: false})
                                )
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Width: =180
                              FillPortions: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              DisabledFill: =RGBA(200, 200, 200, 1)
                              DisabledColor: =RGBA(110, 110, 110, 1)
                              Fill: =colErrore
                              Color: =Color.White
                              HoverFill: =colPrimarioScuro
                              PressedFill: =colPrimarioScuro
                              BorderThickness: =0
                              DisplayMode: =If(true, DisplayMode.Edit, DisplayMode.Disabled)
      - adm_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - adm_rctCaricamento:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 0.65)
                  Height: =Parent.Height
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  OnSelect: =false
            - adm_lblCaricamento:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(varMessaggioCaricamento, "Caricamento in corso…") & Char(10) & "Attendere qualche secondo."
