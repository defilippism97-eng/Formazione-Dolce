                                                FontWeight: =FontWeight.Semibold
                                                X: =12
                                                Y: =4
                                                Width: =Parent.TemplateWidth - 24
                                                Height: =22
                                                OnSelect: =Select(Parent)
                                          - adm_lblCfgValore:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Left(ThisItem.Valore, 90)
                                                Size: =10
                                                Color: =colTestoSecondario
                                                X: =12
                                                Y: =26
                                                Width: =Parent.TemplateWidth - 24
                                                Height: =26
                                                OnSelect: =Select(Parent)
                                          - adm_rctCfgSep:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                Fill: =colBordo
                                                Height: =1
                                                X: =0
                                                Y: =Parent.TemplateHeight - 1
                                                Width: =Parent.TemplateWidth
                              - adm_conEditConfigurazione:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    BorderColor: =colBordo
                                    BorderThickness: =1
                                    PaddingTop: =12
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
