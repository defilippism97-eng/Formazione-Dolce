# =============================================================================
#  Gestione ore formazione – Società Dolce · schermata scrAdmin
#  9 – Amministrazione (Amministratore)
# -----------------------------------------------------------------------------
#  Formato: sorgente YAML di Power Apps Studio (Copia codice / Incolla codice).
#  Come incollarla: vedere powerapps/README.md. Le formule sono in notazione
#  inglese (separatore "," e concatenazione ";"): Studio in italiano le mostra
#  con ";" e ";;" automaticamente.
#  Dati: Patch dirette su Lavoratori, Strutture, Catalogo, Ruoli, Configurazione + 'Registro modifiche'.
# =============================================================================
Screens:
  scrAdmin:
    Properties:
      Fill: =colSfondo
      OnVisible: |-
        =Set(varMenuAperto, false);
        UpdateContext({locDialogo: "", locTab: Coalesce(locTab, "lavoratori")})
    Children:
      - adm_conRadice:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =colSfondo
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - adm_conHeader:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =colPrimario
                  Height: =56
                  FillPortions: =0
                  PaddingLeft: =12
                  PaddingRight: =16
                Children:
                  - adm_icoMenu:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(varMenuAperto, !varMenuAperto)
                        Color: =Color.White
                        Tooltip: |-
                          ="Apri o chiudi il menu"
                        Width: =40
                        Height: =40
                        PaddingTop: =4
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        FillPortions: =0
                        Visible: =isMobile
                  - adm_lblTitoloApp:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestione ore formazione"
                        Size: =16
                        Color: =Color.White
                        FontWeight: =FontWeight.Semibold
                        FillPortions: =1
                        Height: =40
                        LayoutMinWidth: =150
                  - adm_lblUtente:
                      Control: Label@2.5.1
                      Properties:
                        Text: =User().FullName & If(haRuolo, " · " & ruoloApp, "")
                        Size: =11
                        Color: =Color.White
                        Align: =Align.Right
                        Width: =340
                        Height: =40
                        FillPortions: =0
                        Visible: =!isMobile
            - adm_conCorpo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                Children:
                  - adm_conMenu:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =0
                        DropShadow: =DropShadow.None
                        Fill: =colSuperficie
                        Width: =If(isMobile, Parent.Width, 230)
                        FillPortions: =0
                        Visible: =!isMobile || varMenuAperto
                        BorderColor: =colBordo
                        BorderThickness: =1
                        PaddingTop: =8
                      Children:
                        - adm_lblMenuUtente:
                            Control: Label@2.5.1
                            Properties:
                              Text: =User().FullName & Char(10) & ruoloApp
                              Size: =11
                              Color: =colTestoSecondario
                              Visible: =isMobile
                              Height: =48
                              FillPortions: =0
                              PaddingLeft: =12
                              Wrap: =true
                        - adm_galMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =tblMenu
                              TemplateSize: =48
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderColor: =colBordo
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              TemplateFill: =If(ThisItem.Chiave = "admin", colPrimarioChiaro, RGBA(0, 0, 0, 0))
                              OnSelect: |-
                                =Set(varMenuAperto, false);
                                Switch(
                                    ThisItem.Chiave,
                                    "home", Navigate(scrHome, ScreenTransition.None),
                                    "mie", Navigate(scrMieRichieste, ScreenTransition.None),
                                    "nuova", Set(varIdModifica, 0); Navigate(scrRichiesta, ScreenTransition.None),
                                    "team", Navigate(scrTeam, ScreenTransition.None),
                                    "validazione", Navigate(scrValidazioneHR, ScreenTransition.None),
                                    "riepilogo", Navigate(scrRiepilogo, ScreenTransition.None),
                                    "chiusura", Navigate(scrChiusura, ScreenTransition.None),
                                    "admin", Navigate(scrAdmin, ScreenTransition.None),
                                    "profilo", Navigate(scrProfilo, ScreenTransition.None)
                                )
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                            Children:
                              - adm_icoVoceMenu:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =ThisItem.Icona
                                    OnSelect: =Select(Parent)
                                    Color: =If(ThisItem.Chiave = "admin", colPrimario, colTestoSecondario)
                                    Tooltip: |-
                                      =""
                                    Width: =28
                                    Height: =28
                                    PaddingTop: =4
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =12
                                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                              - adm_lblVoceMenu:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Voce
                                    Size: =12
                                    Color: =If(ThisItem.Chiave = "admin", colPrimario, colTesto)
                                    FontWeight: =If(ThisItem.Chiave = "admin", FontWeight.Semibold, FontWeight.Normal)
                                    X: =48
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 56
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                              - adm_rctVoceAttiva:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =colPrimario
                                    Height: =Parent.TemplateHeight
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Visible: =ThisItem.Chiave = "admin"
                  - adm_conContenuto:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =colSfondo
                        FillPortions: =1
                        Visible: =!isMobile || !varMenuAperto
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =If(isMobile, 12, 24)
                        PaddingRight: =If(isMobile, 12, 24)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - adm_lblTitolo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Amministrazione"
                              Size: =18
                              Color: =colPrimario
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              FillPortions: =0
                        - adm_lblNonAutorizzato:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                ="Questa sezione è riservata agli amministratori dell’applicazione."
                              Size: =12
                              Color: =colErrore
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              FillPortions: =0
                              Visible: =!isAdmin
                        - adm_conTabs:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutWrap: =true
                              Height: =If(isMobile, 3 * 48, If(App.Width < 1250, 96, 48))
                              FillPortions: =0
                              Visible: =isAdmin
                            Children:
                              - adm_btnTabLavoratori:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Lavoratori"
                                    OnSelect: |-
                                      =UpdateContext({locTab: "lavoratori"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =If(locTab = "lavoratori", colPrimario, Color.White)
                                    Color: =If(locTab = "lavoratori", Color.White, colPrimario)
                                    HoverFill: =If(locTab = "lavoratori", colPrimarioScuro, colPrimarioChiaro)
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                              - adm_btnTabStrutture:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Organigramma"
                                    OnSelect: |-
                                      =UpdateContext({locTab: "strutture"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =If(locTab = "strutture", colPrimario, Color.White)
                                    Color: =If(locTab = "strutture", Color.White, colPrimario)
                                    HoverFill: =If(locTab = "strutture", colPrimarioScuro, colPrimarioChiaro)
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                              - adm_btnTabCatalogo:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Catalogo corsi"
                                    OnSelect: |-
                                      =UpdateContext({locTab: "catalogo"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =If(locTab = "catalogo", colPrimario, Color.White)
                                    Color: =If(locTab = "catalogo", Color.White, colPrimario)
                                    HoverFill: =If(locTab = "catalogo", colPrimarioScuro, colPrimarioChiaro)
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                              - adm_btnTabRuoli:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Ruoli e utenti"
                                    OnSelect: |-
                                      =UpdateContext({locTab: "ruoli"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =If(locTab = "ruoli", colPrimario, Color.White)
                                    Color: =If(locTab = "ruoli", Color.White, colPrimario)
                                    HoverFill: =If(locTab = "ruoli", colPrimarioScuro, colPrimarioChiaro)
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                              - adm_btnTabConfigurazione:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: |-
                                      ="Configurazione"
                                    OnSelect: |-
                                      =UpdateContext({locTab: "configurazione"})
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Width: =170
                                    FillPortions: =0
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    DisabledFill: =RGBA(200, 200, 200, 1)
                                    DisabledColor: =RGBA(110, 110, 110, 1)
                                    Fill: =If(locTab = "configurazione", colPrimario, Color.White)
                                    Color: =If(locTab = "configurazione", Color.White, colPrimario)
                                    HoverFill: =If(locTab = "configurazione", colPrimarioScuro, colPrimarioChiaro)
                                    PressedFill: =colPrimarioChiaro
                                    HoverColor: =colPrimario
                                    BorderColor: =colPrimario
                                    BorderThickness: =1
                        - adm_conTabLavoratori:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =If(isMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =16
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =If(isMobile, 1500, Max(600, App.Height - 200))
                              Visible: =isAdmin && locTab = "lavoratori"
                            Children:
                              - adm_conListaLavoratori:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    BorderColor: =colBordo
                                    BorderThickness: =1
                                    PaddingTop: =12
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    FillPortions: =2
                                    LayoutMinWidth: =300
                                    Height: =100
                                  Children:
                                    - adm_lblSezLav:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Lavoratori"
                                          Size: =14
                                          Color: =colPrimario
                                          FontWeight: =FontWeight.Semibold
                                          Height: =32
                                          FillPortions: =0
                                          VerticalAlign: =VerticalAlign.Bottom
                                    - adm_txtCercaLav:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          Default: |-
                                            =""
                                          HintText: |-
                                            ="Cerca per cognome, nominativo o login"
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          DelayOutput: =true
                                    - adm_conLavFiltri:
                                        Control: GroupContainer@1.3.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =8
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Height: =40
                                          FillPortions: =0
                                        Children:
                                          - adm_tglSoloSegn:
                                              Control: Classic/Toggle@2.1.0
                                              Properties:
                                                Default: =false
                                                TrueText: |-
                                                  ="Solo con segnalazione"
                                                FalseText: |-
                                                  ="Tutti"
                                                TrueFill: =colPrimario
                                                Height: =36
                                                Width: =220
                                                FillPortions: =0
                                                Size: =12
                                          - adm_btnNuovoLav:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                Text: |-
                                                  ="+ Nuovo"
                                                OnSelect: |-
                                                  =UpdateContext({locLav: Blank(), locNuovoLav: true});
                                                  Reset(adm_cmbLavUtente);
                                                  Reset(adm_txtLavLogin);
                                                  Reset(adm_txtLavCognome);
                                                  Reset(adm_txtLavNome);
                                                  Reset(adm_txtLavEmail);
                                                  Reset(adm_cmbLavStruttura);
                                                  Reset(adm_cmbLavCoord);
                                                  Reset(adm_ddLavStato);
                                                  Reset(adm_dtpLavInizio);
                                                  Reset(adm_dtpLavFine);
                                                  Reset(adm_txtLavCF)
                                                Size: =12
                                                FontWeight: =FontWeight.Semibold
                                                Height: =36
                                                Width: =110
                                                FillPortions: =0
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                DisabledFill: =RGBA(200, 200, 200, 1)
                                                DisabledColor: =RGBA(110, 110, 110, 1)
                                                Fill: =colPrimario
                                                Color: =Color.White
                                                HoverFill: =colPrimarioScuro
                                                PressedFill: =colPrimarioScuro
                                                BorderThickness: =0
                                    - adm_galLav:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          Items: |-
                                            =Sort(
                                                Filter(
                                                    Lavoratori,
                                                    IsBlank(adm_txtCercaLav.Text) || StartsWith(Nominativo, adm_txtCercaLav.Text) || StartsWith(Cognome, adm_txtCercaLav.Text) || StartsWith('Login Microsoft 365', Lower(adm_txtCercaLav.Text)),
                                                    !adm_tglSoloSegn.Value || 'Segnalazione da gestire' = true
                                                ),
                                                Nominativo
                                            )
                                          TemplateSize: =60
                                          TemplatePadding: =0
                                          ShowScrollbar: =true
                                          BorderColor: =colBordo
                                          BorderThickness: =0
                                          Fill: =colSuperficie
                                          OnSelect: |-
                                            =UpdateContext({locLav: ThisItem, locNuovoLav: false});
                                            Reset(adm_cmbLavUtente);
                                            Reset(adm_txtLavLogin);
                                            Reset(adm_txtLavCognome);
                                            Reset(adm_txtLavNome);
                                            Reset(adm_txtLavEmail);
                                            Reset(adm_cmbLavStruttura);
                                            Reset(adm_cmbLavCoord);
                                            Reset(adm_ddLavStato);
                                            Reset(adm_dtpLavInizio);
                                            Reset(adm_dtpLavFine);
                                            Reset(adm_txtLavCF)
                                          TemplateFill: =If(ThisItem.ID = locLav.ID, colPrimarioChiaro, RGBA(0, 0, 0, 0))
                                          FillPortions: =1
                                        Children:
                                          - adm_lblLavNom:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =ThisItem.Nominativo & If(ThisItem.'Stato lavoratore'.Value = "Non attivo", " (non attivo)", "")
                                                Size: =12
                                                Color: =colTesto
                                                FontWeight: =FontWeight.Semibold
                                                X: =12
                                                Y: =4
                                                Width: =Parent.TemplateWidth - 56
                                                Height: =24
                                                OnSelect: =Select(Parent)
                                          - adm_lblLavInfo:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =ThisItem.'Login Microsoft 365' & " · " & ThisItem.Servizio & " · coord. " & Coalesce(ThisItem.'Nome coordinatore', "—")
                                                Size: =10
                                                Color: =colTestoSecondario
                                                X: =12
                                                Y: =28
                                                Width: =Parent.TemplateWidth - 56
                                                Height: =28
                                                Wrap: =true
                                                OnSelect: =Select(Parent)
                                          - adm_icoLavSegn:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Icon: =Icon.Warning
                                                OnSelect: =Select(Parent)
                                                Color: =colAvviso
                                                Tooltip: |-
                                                  ="Segnalazione da gestire"
                                                Width: =32
                                                Height: =32
                                                PaddingTop: =4
                                                PaddingBottom: =4
                                                PaddingLeft: =4
                                                PaddingRight: =4
                                                X: =Parent.TemplateWidth - 40
                                                Y: =14
                                                Visible: =ThisItem.'Segnalazione da gestire'
                                          - adm_rctLavSep:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                Fill: =colBordo
                                                Height: =1
                                                X: =0
                                                Y: =Parent.TemplateHeight - 1
                                                Width: =Parent.TemplateWidth
                              - adm_conEditLavoratori:
                                  Control: GroupContainer@1.3.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =colSuperficie
                                    BorderColor: =colBordo
                                    BorderThickness: =1
                                    PaddingTop: =12
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    FillPortions: =3
                                    LayoutMinWidth: =320
                                    Height: =100
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    Visible: =locNuovoLav || !IsBlank(locLav.ID)
                                  Children:
                                    - adm_lblEditLav:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            =If(locNuovoLav, "Nuovo lavoratore", "Modifica: " & locLav.Nominativo)
                                          Size: =14
                                          Color: =colPrimario
                                          FontWeight: =FontWeight.Semibold
                                          Height: =32
                                          FillPortions: =0
                                          VerticalAlign: =VerticalAlign.Bottom
                                    - adm_lblCampoLavUtente:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Utente Microsoft 365 (cerca per nome o e-mail)"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - adm_cmbLavUtente:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          Items: =Choices(Lavoratori.'Utente Microsoft 365')
                                          DisplayFields: =["DisplayName"]
                                          SearchFields: =["DisplayName", "Email"]
                                          SelectMultiple: =false
                                          IsSearchable: =true
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          ChevronBackground: =colPrimario
                                          ChevronFill: =Color.White
                                          InputTextPlaceholder: |-
                                            ="Cerca…"
                                          DefaultSelectedItems: =If(IsBlank(locLav.'Utente Microsoft 365'.Email), Blank(), Table(locLav.'Utente Microsoft 365'))
                                    - adm_lblCampoLavLogin:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Login (automatico = e-mail Microsoft 365 in minuscolo)"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - adm_txtLavLogin:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          Default: |-
                                            =If(
                                                !IsBlank(adm_cmbLavUtente.Selected.Email) && Lower(adm_cmbLavUtente.Selected.Email) <> Lower(locLav.'Utente Microsoft 365'.Email),
                                                Lower(adm_cmbLavUtente.Selected.Email),
                                                Coalesce(locLav.'Login Microsoft 365', Lower(adm_cmbLavUtente.Selected.Email))
                                            )
                                          HintText: |-
                                            ="nome.cognome@societadolce.it"
                                          Size: =12
                                          BorderColor: =colBordo
                                          Height: =36
                                          FillPortions: =0
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                    - adm_lblCampoLavEmail:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="E-mail aziendale (se in possesso)"
                                          Size: =11
                                          Color: =colTestoSecondario
                                          Height: =20
                                          FillPortions: =0
                                    - adm_txtLavEmail:
