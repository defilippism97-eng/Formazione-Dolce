                                                                          'Coordinatore servizio': If(IsBlank(cs.Email), Blank(), {Claims: "i:0#.f|membership|" & Lower(cs.Email), DisplayName: cs.DisplayName, Email: cs.Email, Department: "", JobTitle: "", Picture: ""}),
