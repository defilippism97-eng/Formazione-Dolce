                                                PressedFill: =colPrimarioChiaro
                                                HoverColor: =colPrimario
                                                BorderColor: =colPrimario
                                                BorderThickness: =1
                                    - adm_lblInfoLav:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="Il ruolo Coordinatore non si assegna a mano: nasce dall’assegnazione dei lavoratori al coordinatore. Ogni salvataggio viene registrato nel Registro modifiche."
