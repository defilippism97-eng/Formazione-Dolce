      - tea_conCaricamento:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =varCaricamento
          Children:
            - tea_rctCaricamento:
                Control: Rectangle@2.3.0
